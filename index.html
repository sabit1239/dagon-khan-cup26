<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dagon Khan Cup 26</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#D4A017;--g2:#F5C518;--g3:#ffe066;
  --bg:#08080f;--bg2:#0f0f1c;--bg3:#151525;--bg4:#1c1c30;
  --card:#111120;--card2:#181830;
  --brd:rgba(212,160,23,0.15);--brd2:rgba(212,160,23,0.32);
  --txt:#d8d8f0;--mt:#5a5a8a;--ft:#252540;
  --gn:#12b05a;--gn2:rgba(18,176,90,0.12);
  --rd:#d93030;--rd2:rgba(217,48,48,0.12);
  --pu:rgba(168,85,247,0.15);--pu2:#c084fc;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}

/* HEADER */
.hd{background:var(--bg2);border-bottom:1px solid var(--brd2);padding:16px;position:relative;overflow:hidden;text-align:center}
.hd::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:300px;height:120px;background:radial-gradient(ellipse,rgba(212,160,23,0.08) 0%,transparent 70%);pointer-events:none}
.hd-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hd-pill{font-size:9px;letter-spacing:2px;color:var(--mt);background:var(--bg4);border:1px solid var(--brd);border-radius:20px;padding:3px 10px}
.hd-right{display:flex;gap:8px;align-items:center}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ft)}
.live-dot.on{background:var(--gn);box-shadow:0 0 6px var(--gn);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.adm-btn{font-size:10px;font-weight:600;color:var(--g);background:rgba(212,160,23,0.08);border:1px solid var(--brd2);border-radius:20px;padding:4px 12px;cursor:pointer}
.logos{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.logo-svg{width:40px;height:40px}
.hd-title{font-family:'Rajdhani',sans-serif;font-size:clamp(20px,5.5vw,36px);font-weight:700;color:var(--g2);letter-spacing:1px;line-height:1}
.hd-sub{font-size:10px;color:var(--mt);letter-spacing:1.5px;margin-top:4px}
.hd-tags{display:flex;justify-content:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.hd-tag{font-size:9px;color:var(--g);background:rgba(212,160,23,0.07);border:1px solid var(--brd);border-radius:4px;padding:2px 8px}

/* TICKER */
.ticker{background:var(--bg3);border-bottom:1px solid var(--brd);padding:5px 0;overflow:hidden;position:relative}
.ticker::before,.ticker::after{content:'';position:absolute;top:0;bottom:0;width:30px;z-index:1}
.ticker::before{left:0;background:linear-gradient(90deg,var(--bg3),transparent)}
.ticker::after{right:0;background:linear-gradient(-90deg,var(--bg3),transparent)}
.ticker-inner{display:flex;width:max-content;animation:scroll 25s linear infinite}
.t-item{font-size:10px;color:var(--txt);padding:0 20px;white-space:nowrap;border-right:1px solid var(--brd)}
.t-item b{color:var(--g2)}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* STATS BAR */
.stats{display:flex;background:var(--card);border-bottom:1px solid var(--brd)}
.st{flex:1;padding:9px 4px;text-align:center;border-right:1px solid var(--brd)}
.st:last-child{border-right:none}
.sv{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:var(--g2);line-height:1}
.sl{font-size:8px;color:var(--mt);margin-top:2px;letter-spacing:.5px}

/* NAV */
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--brd);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:40}
.nav::-webkit-scrollbar{display:none}
.nt{flex-shrink:0;padding:10px 14px;font-size:11px;font-weight:500;color:var(--mt);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.nt.on{color:var(--g2);border-bottom-color:var(--g2)}

/* MAIN */
.main{padding:12px;max-width:900px;margin:0 auto}
.pg{display:none}.pg.on{display:block}

/* GROUP GRID */
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:400px){.gg{grid-template-columns:1fr}}
.gc{background:var(--card);border:1px solid var(--brd);border-radius:10px;overflow:hidden}
.gh{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--brd)}
.ghn{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;letter-spacing:.5px}
.ghd{font-size:8px;color:var(--mt)}
.ga .gh{background:rgba(59,130,246,0.07)}.ga .ghn{color:#60a5fa}
.gb .gh{background:rgba(239,68,68,0.07)}.gb .ghn{color:#f87171}
.gc2 .gh{background:rgba(34,197,94,0.07)}.gc2 .ghn{color:#4ade80}
.gd .gh{background:rgba(168,85,247,0.07)}.gd .ghn{color:#c084fc}

/* PT TABLE */
.pt{width:100%;border-collapse:collapse}
.pt th{padding:4px 4px;text-align:center;color:var(--mt);font-size:8px;font-weight:600;border-bottom:1px solid var(--brd)}
.pt th.tl{text-align:left;padding-left:8px}
.pt td{padding:6px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.03);font-size:10px}
.pt td.tl{text-align:left;padding-left:8px}
.pt tr:last-child td{border-bottom:none}
.ptg{font-weight:700;font-size:12px;color:var(--g2)}
.rq1{background:rgba(18,176,90,0.06)}.rq2{background:rgba(59,130,246,0.04)}.re{opacity:.4}
.pb{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:8px;font-weight:700}
.p1{background:var(--g2);color:#000}.p2{background:#94a3b8;color:#000}.p3{background:#2a2a3a;color:var(--mt)}
.pn{display:flex;align-items:center;gap:5px}
.av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0}
.avOVI{background:rgba(59,130,246,0.2);color:#60a5fa}
.avSABIT{background:rgba(212,160,23,0.2);color:var(--g2)}
.avNASIM{background:rgba(239,68,68,0.2);color:#f87171}
.avJAWAD{background:rgba(34,197,94,0.2);color:#4ade80}
.avMUNNA{background:rgba(168,85,247,0.2);color:#c084fc}
.avTAHIN{background:rgba(234,88,12,0.2);color:#fb923c}
.avIMRAN{background:rgba(6,182,212,0.2);color:#22d3ee}
.avFOKRUL{background:rgba(236,72,153,0.2);color:#f472b6}
.avOPI{background:rgba(132,204,22,0.2);color:#a3e635}
.avMUNTAHIR{background:rgba(245,158,11,0.2);color:#fbbf24}
.avHASMOT{background:rgba(99,102,241,0.2);color:#818cf8}
.avNOYON{background:rgba(20,184,166,0.2);color:#2dd4bf}
.avTBD{background:var(--ft);color:var(--mt)}
.qc{font-size:7px;font-weight:700;padding:1px 4px;border-radius:3px;margin-left:2px}
.qq{background:var(--gn2);color:var(--gn)}.qe{background:var(--rd2);color:var(--rd)}

/* RESULTS FEED */
.feed{display:flex;flex-direction:column;gap:7px}
.fi{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.fi-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.fi-body{flex:1;font-size:11px;line-height:1.6;color:var(--txt)}
.fi-body .W{color:var(--gn);font-weight:600}
.fi-body .L{color:var(--rd)}
.fi-body strong{color:var(--g2);font-weight:600}
.fi-right{text-align:center;flex-shrink:0}
.fi-score{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:var(--g2)}
.fi-id{font-size:8px;color:var(--mt)}
.qual-banner{background:rgba(18,176,90,0.06);border:1px solid rgba(18,176,90,0.2);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.qb-text{font-size:11px;line-height:1.6;flex:1}
.qb-text .W{color:var(--gn);font-weight:600}
.qb-text .L{color:var(--rd)}

/* MATCH ITEMS */
.ml{display:flex;flex-direction:column;gap:7px}
.mi{background:var(--card);border:1px solid var(--brd);border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:7px;transition:border-color .2s}
.mi:hover{border-color:var(--brd2)}
.mid{font-size:9px;color:var(--mt);min-width:22px;font-weight:600}
.mh{flex:1;font-size:11px;font-weight:500}
.mhr{flex:1;font-size:11px;font-weight:500;text-align:right}
.msb{min-width:52px;text-align:center;font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:var(--g2)}
.msp{color:var(--mt);font-size:9px;font-family:'Inter',sans-serif;font-weight:400}
.mmeta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:40px}
.mst{font-size:8px;padding:2px 6px;border-radius:5px;font-weight:600}
.ft{background:var(--gn2);color:var(--gn)}.up{background:rgba(90,90,138,0.12);color:var(--mt)}
.wt{font-size:8px;color:var(--g2)}.dt{font-size:8px;color:#f97316}

/* KNOCKOUT MATCH CARD — special */
.ko-card{background:var(--card);border:1px solid var(--brd2);border-radius:12px;overflow:hidden;margin-bottom:10px}
.ko-header{padding:7px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--brd)}
.ko-round{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;color:var(--g);letter-spacing:1px}
.ko-date{font-size:9px;color:var(--mt)}
.ko-match{padding:12px 14px;display:flex;align-items:center;gap:10px}
.ko-team{flex:1;font-weight:600;font-size:13px}
.ko-team.r{text-align:right}
.ko-team.tbd{color:var(--ft)}
.ko-score{min-width:64px;text-align:center;font-family:'Rajdhani',sans-serif;font-size:24px;font-weight:700;color:var(--g2)}
.ko-score.pending{color:var(--ft);font-size:14px;font-family:'Inter',sans-serif;font-weight:400}
.ko-meta{padding:0 14px 10px;display:flex;align-items:center;justify-content:space-between}
.ko-winner{font-size:10px;color:var(--gn);font-weight:600}
.ko-status{font-size:8px;padding:2px 8px;border-radius:5px;font-weight:600}

/* FINAL CARD */
.final-card{background:var(--card);border:2px solid var(--brd2);border-radius:14px;overflow:hidden;margin-bottom:10px;position:relative}
.final-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(212,160,23,0.05),transparent);pointer-events:none}
.final-trophy{text-align:center;font-size:28px;padding:12px 0 4px}
.final-label{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;color:var(--g2);letter-spacing:2px;text-align:center;margin-bottom:8px}

/* BRACKET */
.bracket-scroll{overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.bracket{display:flex;gap:2px;min-width:480px}
.br-round{flex:1;padding:0 5px}
.brt{font-size:8px;color:var(--mt);font-weight:600;letter-spacing:1px;text-align:center;margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--brd);text-transform:uppercase}
.brm{background:var(--card);border:1px solid var(--brd);border-radius:7px;overflow:hidden;margin:4px 0}
.brmt{padding:5px 8px;font-size:10px;font-weight:500;display:flex;justify-content:space-between;border-bottom:1px solid var(--brd)}
.brmt:last-child{border-bottom:none}
.brmt.tbd{color:var(--ft)}.brmt.win{color:var(--g2);font-weight:600}
.br-score{font-family:'Rajdhani',sans-serif;font-size:12px;color:var(--g2)}

/* COUNTDOWN */
.cd{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px;margin-bottom:10px;text-align:center}
.cdl{font-size:8px;color:var(--mt);letter-spacing:1.5px;margin-bottom:4px}
.cdm{font-size:12px;font-weight:600;margin-bottom:8px}
.cdt{display:flex;justify-content:center;align-items:center;gap:4px}
.cdu{background:var(--bg4);border-radius:7px;padding:6px 8px;min-width:40px;text-align:center}
.cdn{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:var(--g2);line-height:1}
.cdlb{font-size:7px;color:var(--mt)}
.cdsp{font-family:'Rajdhani',sans-serif;font-size:18px;color:var(--ft);margin-bottom:8px}

/* STATS */
.sc-item{background:var(--card);border:1px solid var(--brd);border-radius:9px;padding:9px 12px;display:flex;align-items:center;gap:10px;margin-bottom:7px}
.sc-rank{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:var(--ft);min-width:18px}
.rg{color:var(--g2)}.rs{color:#94a3b8}.rb{color:#b45309}
.sc-info{flex:1}
.sc-name{font-weight:600;font-size:12px}
.sc-grp{font-size:9px;color:var(--mt);margin-bottom:3px}
.bar-wrap{height:3px;background:var(--ft);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--g),var(--g3))}
.sc-goals{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--g2);text-align:center}
.sc-gl{font-size:8px;color:var(--mt);text-align:center}
.bm-card{background:var(--card);border:1px solid var(--brd2);border-radius:10px;padding:14px;text-align:center;margin-bottom:10px}
.bm-lbl{font-size:9px;color:var(--g);font-weight:700;letter-spacing:1.5px;margin-bottom:6px}
.bm-row{display:flex;align-items:center;justify-content:center;gap:8px}
.bm-t{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;flex:1;text-align:center}
.bm-s{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;color:var(--g2);min-width:60px}
.bm-sub{font-size:10px;color:var(--mt);margin-top:4px}
.wr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.wrc{background:var(--card);border:1px solid var(--brd);border-radius:9px;padding:8px 6px;text-align:center}
.wrn{font-size:10px;font-weight:600}
.wrg{font-size:8px;color:var(--mt);margin-bottom:5px}
.wr-ring{position:relative;width:44px;height:44px;margin:0 auto 4px}
.wr-svg{transform:rotate(-90deg)}
.wrt2{fill:none;stroke:var(--ft);stroke-width:4}
.wrf{fill:none;stroke-width:4;stroke-linecap:round}
.wr-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;color:var(--g2)}
.wr-wdl{display:flex;justify-content:center;gap:4px;font-size:8px}
.ww{color:var(--gn)}.wd{color:#fbbf24}.wl{color:var(--rd)}

/* SECTION TITLE */
.stitle{font-size:9px;color:var(--mt);font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.stitle::after{content:'';flex:1;height:1px;background:var(--brd)}
.sgap{margin-top:16px}

/* SHARE */
.share-row{display:flex;gap:7px;margin-top:10px}
.swa{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:#25d366;color:#fff;border:none;border-radius:7px;padding:8px;font-size:11px;font-weight:600;cursor:pointer}
.scp{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--bg4);color:var(--txt);border:1px solid var(--brd);border-radius:7px;padding:8px;font-size:11px;cursor:pointer}

/* ADMIN */
.ao{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:200;overflow-y:auto}
.ao.on{display:block}
.am{background:var(--bg3);border:1px solid var(--brd2);border-radius:14px;padding:18px;max-width:380px;margin:24px auto}
.at{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:var(--g2);margin-bottom:12px;text-align:center}
.fg{margin-bottom:10px}
.fl{font-size:9px;color:var(--mt);margin-bottom:4px;display:block;letter-spacing:.5px;text-transform:uppercase}
.fi2{width:100%;background:var(--bg4);border:1px solid var(--brd);color:var(--txt);font-family:'Inter',sans-serif;font-size:13px;padding:7px 10px;border-radius:7px;outline:none}
.fi2:focus{border-color:var(--g)}
.sel{width:100%;background:var(--bg4);border:1px solid var(--brd);color:var(--txt);font-size:12px;padding:7px 10px;border-radius:7px;outline:none}
.sel option{background:var(--bg3)}
.bg{width:100%;background:var(--g2);color:#000;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;padding:9px;border:none;border-radius:7px;cursor:pointer;margin-top:3px}
.bgh{width:100%;background:transparent;color:var(--mt);font-size:11px;padding:7px;border:1px solid var(--brd);border-radius:7px;cursor:pointer;margin-top:6px}
.em{font-size:10px;color:var(--rd);margin-top:6px;text-align:center}
.mui{background:var(--bg4);border:1px solid var(--brd);border-radius:8px;padding:10px;margin-bottom:8px}
.muh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.muid{font-size:11px;font-weight:600}
.muvs{color:var(--mt);font-size:9px;font-weight:400}
.si-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sin{width:46px;text-align:center;font-size:16px;font-family:'Rajdhani',sans-serif;font-weight:700;background:var(--bg3);border:1px solid var(--brd2);color:var(--g2);border-radius:7px;padding:4px;outline:none}
.sd{color:var(--mt);font-size:14px}
.sb{font-size:9px;padding:4px 10px;background:var(--g2);color:#000;border:none;border-radius:5px;font-weight:700;cursor:pointer;font-family:'Rajdhani',sans-serif}
.rb2{font-size:9px;padding:3px 7px;background:transparent;color:var(--rd);border:1px solid rgba(217,48,48,0.25);border-radius:5px;cursor:pointer}
.mst2{margin-top:4px;font-size:9px}
.lb{width:100%;background:transparent;color:var(--rd);font-size:11px;padding:7px;border:1px solid rgba(217,48,48,0.2);border-radius:7px;cursor:pointer;margin-top:10px}
.adm-tabs{display:flex;gap:0;background:var(--bg4);border-radius:7px;overflow:hidden;margin-bottom:12px}
.adm-tab{flex:1;padding:7px;text-align:center;font-size:10px;font-weight:600;color:var(--mt);cursor:pointer;border:none;background:transparent;transition:all .2s}
.adm-tab.on{background:var(--g2);color:#000}
.ko-section{background:rgba(212,160,23,0.05);border:1px solid var(--brd);border-radius:8px;padding:10px;margin-bottom:8px}
.ko-section-title{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;color:var(--g);letter-spacing:1px;margin-bottom:8px}

/* TOAST */
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg3);border:1px solid var(--brd2);border-radius:8px;padding:8px 16px;font-size:11px;z-index:300;transition:transform .25s;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.on{transform:translateX(-50%) translateY(0)}
.note{font-size:9px;color:var(--ft);text-align:center;margin-top:10px;letter-spacing:.5px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hd">
  <div class="hd-top">
    <div class="hd-pill">EFOOTBALL™</div>
    <div class="hd-right">
      <div class="live-dot" id="ldot"></div>
      <div class="adm-btn" onclick="openAdmin()">⚙ Admin</div>
    </div>
  </div>
  <div class="logos">
    <svg class="logo-svg" viewBox="0 0 40 40">
      <defs><linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F5C518"/><stop offset="100%" stop-color="#a07000"/></linearGradient></defs>
      <polygon points="20,1 37,10 37,28 20,39 3,28 3,10" fill="rgba(212,160,23,0.1)" stroke="url(#g1)" stroke-width="1.2"/>

async function loadDB(){
  try{
    const[{data:gd,error:ge},{data:kd,error:ke}]=await Promise.all([
      db.from('matches').select('*'),
      db.from('knockout_matches').select('*')

    if(gd&&gd.length)gd.forEach(r=>{const m=M.find(x=>x.id===r.match_id);if(m){m.hg=r.hg;m.ag=r.ag;m.done=r.done;}});
    if(!ke&&kd&&kd.length)kd.forEach(r=>{const k=KO.find(x=>x.id===r.match_id);if(k){k.h=r.h||'';k.a=r.a||'';k.hg=r.hg;k.ag=r.ag;k.done=r.done;}});
    setLive(true);
  }catch(e){setLive(false);console.warn(e.message);}
  fillKOTeams();
  updateStats();updateTicker();renderAll();
}

}

function setLive(ok){
  const d=document.getElementById('ldot');

}

// ── FILL KO TEAMS FROM GROUP RESULTS ─────────────────────────
function fillKOTeams(){
  const q={};
  Object.keys(GROUPS).forEach(k=>{
    const done=M.filter(m=>m.g===k).every(m=>m.done);
    if(done){const s=calc(k);q[k]={f:s[0].n,s:s[1].n};}
    else{q[k]={f:'Grp '+k+' 1st',s:'Grp '+k+' 2nd'};}
  });
  // QF matchups: QF1=A1st vs D2nd, QF2=B1st vs C2nd, QF3=C1st vs B2nd, QF4=D1st vs A2nd
  const setIfEmpty=(id,h,a)=>{const k=KO.find(x=>x.id===id);if(k&&!k.done){k.h=h;k.a=a;}};
  setIfEmpty('QF1',q.A.f,q.D.s);setIfEmpty('QF2',q.B.f,q.C.s);
  setIfEmpty('QF3',q.C.f,q.B.s);setIfEmpty('QF4',q.D.f,q.A.s);
  // SF teams from QF winners
  const qfw=id=>{const k=KO.find(x=>x.id===id);return k&&k.done?(k.hg>k.ag?k.h:k.a):(id+' Winner');};
  setIfEmpty('SF1',qfw('QF1'),qfw('QF2'));setIfEmpty('SF2',qfw('QF3'),qfw('QF4'));
  // Final & 3rd
  const sfw=id=>{const k=KO.find(x=>x.id===id);return k&&k.done?(k.hg>k.ag?k.h:k.a):(id+' Winner');};
  const sfl=id=>{const k=KO.find(x=>x.id===id);return k&&k.done?(k.hg<k.ag?k.h:k.a):(id+' Runner-up');};
  setIfEmpty('FIN',sfw('SF1'),sfw('SF2'));setIfEmpty('3RD',sfl('SF1'),sfl('SF2'));
}

// ── STANDINGS ─────────────────────────────────────────────────
function calc(grp){
  const ps=GROUPS[grp].p;const s={};
  ps.forEach(p=>s[p]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  M.filter(m=>m.g===grp&&m.done).forEach(m=>{
    s[m.h].p++;s[m.a].p++;s[m.h].gf+=m.hg;s[m.h].ga+=m.ag;s[m.a].gf+=m.ag;s[m.a].ga+=m.hg;
    if(m.hg>m.ag){s[m.h].w++;s[m.h].pts+=3;s[m.a].l++;}
    else if(m.hg<m.ag){s[m.a].w++;s[m.a].pts+=3;s[m.h].l++;}
    else{s[m.h].d++;s[m.h].pts++;s[m.a].d++;s[m.a].pts++;}
  });
  return ps.map(p=>({n:p,...s[p],gd:s[p].gf-s[p].ga})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.n.localeCompare(b.n));
}

function av(n){
  const cls='av'+n.replace(/\s/g,'');
  const known=['OVI','SABIT','NASIM','JAWAD','MUNNA','TAHIN','IMRAN','FOKRUL','OPI','MUNTAHIR','HASMOT','NOYON'];
  const c=known.includes(n)?'av'+n:'avTBD';
  return`<div class="av ${c}">${n.slice(0,2)}</div>`;
}

function updateStats(){
  const pl=M.filter(m=>m.done);const g=pl.reduce((s,m)=>s+m.hg+m.ag,0);
  let q=0;Object.keys(GROUPS).forEach(k=>{if(M.filter(m=>m.g===k).every(m=>m.done))q+=2;});
  document.getElementById('sb1').textContent=pl.length;
  document.getElementById('sb2').textContent=12-pl.length;
  document.getElementById('sb3').textContent=g;
  document.getElementById('sb4').textContent=pl.length?(g/pl.length).toFixed(1):'—';
  document.getElementById('sb5').textContent=q;
}

  if(!items.length)items=['<div class="t-item"><b>DAGON KHAN CUP 26</b> · May 24 – Jun 1, 2026</div>','<div class="t-item">12 Players · 4 Groups · <b>Only 1 Champion</b></div>'];

}

function renderGroups(){

  }).join('')+'</div><div class="note">🟢 Top 2 qualify · 🔴 3rd eliminated</div>';

// ── RENDER RESULTS ────────────────────────────────────────────
function renderResults(){
  const allPlayed=[...M.filter(m=>m.done),...KO.filter(k=>k.done)].reverse();
  if(!allPlayed.length){document.getElementById('pg-results').innerHTML='<div style="text-align:center;padding:40px;color:var(--mt);font-size:12px">No results yet</div>';return;}
  let qualHTML='';
  Object.keys(GROUPS).forEach(k=>{
    if(M.filter(m=>m.g===k).every(m=>m.done)){
      const st=calc(k);
      qualHTML+=`<div class="qual-banner"><div style="font-size:18px">🏅</div><div class="qb-text">Group ${k} complete! <span class="W">${st[0].n}</span> (1st) and <span class="W">${st[1].n}</span> (2nd) advance to QF. <span class="L">${st[2].n}</span> is eliminated.</div></div>`;
    }
  });
  // Knockout results
  const koPlayed=KO.filter(k=>k.done);
  let koHTML='';
  if(koPlayed.length){
    koHTML=`<div class="sgap"><div class="stitle">Knockout Results</div><div class="feed">`+
    koPlayed.map(m=>{
      const w=m.hg>m.ag?m.h:m.hg<m.ag?m.a:null;
      const l=w?(w===m.h?m.a:m.h):null;
      const isFinal=m.id==='FIN';
      let icon=isFinal?'🏆':m.id==='3RD'?'🥉':'⚡';
      let txt=isFinal?`🏆 <span class="W">${w||'TBD'}</span> is the <strong>DAGON KHAN CUP 26 CHAMPION!</strong>`
        :w?`<span class="W">${w}</span> beat <span class="L">${l}</span> <strong>${m.hg}–${m.ag}</strong> in the ${m.round}.`
        :`<strong>${m.h}</strong> and <strong>${m.a}</strong> drew <strong>${m.hg}–${m.ag}</strong> in the ${m.round}.`;
      return`<div class="fi" style="${isFinal?'border-color:var(--brd2);background:rgba(212,160,23,0.04)':''}">
        <div class="fi-icon">${icon}</div><div class="fi-body">${txt}</div>
        <div class="fi-right"><div class="fi-score">${m.hg}–${m.ag}</div><div class="fi-id">${m.id}</div></div></div>`;
    }).join('')+'</div></div>';
  }
  const items=M.filter(m=>m.done).slice().reverse().map(m=>{
    const diff=Math.abs(m.hg-m.ag);const draw=m.hg===m.ag;
    const winner=m.hg>m.ag?m.h:m.a;const loser=m.hg>m.ag?m.a:m.h;
    const ws=m.hg>m.ag?m.hg:m.ag;const ls=m.hg>m.ag?m.ag:m.hg;
    let icon='⚽';let txt='';
    if(draw){icon='🤝';txt=`<strong>${m.h}</strong> and <strong>${m.a}</strong> played out a <strong>${m.hg}–${m.ag} draw</strong> in Group ${m.g}.`;}
    else if(diff>=3){icon='💥';txt=`<span class="W">${winner}</span> demolished <span class="L">${loser}</span> <strong>${ws}–${ls}</strong> in Group ${m.g}.`;}
    else if(diff===2){icon='🔥';txt=`<span class="W">${winner}</span> defeated <span class="L">${loser}</span> <strong>${ws}–${ls}</strong> in Group ${m.g}.`;}
    else{icon='⚡';txt=`Thriller in Group ${m.g}! <span class="W">${winner}</span> edged <span class="L">${loser}</span> <strong>${ws}–${ls}</strong>.`;}
    return`<div class="fi"><div class="fi-icon">${icon}</div><div class="fi-body">${txt}</div>
      <div class="fi-right"><div class="fi-score">${m.hg}–${m.ag}</div><div class="fi-id">${m.id}</div></div></div>`;
  }).join('');
  document.getElementById('pg-results').innerHTML=
    (qualHTML?`<div class="stitle">Qualification</div><div class="feed" style="margin-bottom:14px">${qualHTML}</div>`:'')
    +koHTML+`<div class="sgap"><div class="stitle">Group Results</div><div class="feed">${items||'<div style="padding:16px;text-align:center;color:var(--mt);font-size:11px">No group matches played yet</div>'}</div></div>`
    +`<div class="share-row"><button class="swa" onclick="shareWA()">📲 WhatsApp</button><button class="scp" onclick="copyLink()">🔗 Copy Link</button></div>`;
}

        return`<div class="mi"><div class="mid">${m.id}</div><div class="mh">${m.h}</div>${sc}<div class="mhr">${m.a}</div><div class="mmeta">${st}${wt}</div></div>`;
      }).join('')}</div></div>`;
  }).join('');
}

let cdi=null;
function startCD(){
  if(cdi)clearInterval(cdi);
  const t=new Date();t.setHours(t.getHours()+2);
  function tick(){
    const d=t-new Date();if(d<=0){clearInterval(cdi);return;}
    const h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000);
    const fh=document.getElementById('cdh'),fm=document.getElementById('cdm2'),fs=document.getElementById('cds');
    if(fh)fh.textContent=String(h).padStart(2,'0');if(fm)fm.textContent=String(m).padStart(2,'0');if(fs)fs.textContent=String(s).padStart(2,'0');
  }tick();cdi=setInterval(tick,1000);
}

function renderStats(){
  const sm={};
  Object.values(GROUPS).forEach(g=>g.p.forEach(p=>sm[p]={n:p,goals:0,grp:Object.keys(GROUPS).find(k=>GROUPS[k].p.includes(p))}));
  M.filter(m=>m.done).forEach(m=>{sm[m.h].goals+=m.hg;sm[m.a].goals+=m.ag;});
  const sc=Object.values(sm).sort((a,b)=>b.goals-a.goals);
  const mx=sc[0]?.goals||1;
  const rk=i=>i===0?'rg':i===1?'rs':i===2?'rb':'';
  const scHTML=sc.filter(s=>s.goals>0).slice(0,8).map((s,i)=>`
    <div class="sc-item"><div class="sc-rank ${rk(i)}">${i+1}</div>${av(s.n)}
      <div class="sc-info"><div class="sc-name">${s.n}</div><div class="sc-grp">Group ${s.grp}</div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${(s.goals/mx*100).toFixed(0)}%"></div></div></div>
      <div><div class="sc-goals">${s.goals}</div><div class="sc-gl">Goals</div></div></div>`).join('')
    ||'<div style="text-align:center;padding:16px;color:var(--mt);font-size:11px">No goals yet</div>';
  const pl=M.filter(m=>m.done);
  let bmHTML='<div style="text-align:center;padding:16px;color:var(--mt);font-size:11px">No matches yet</div>';
  if(pl.length){
    const best=pl.reduce((b,m)=>m.hg+m.ag>b.hg+b.ag?m:b,pl[0]);
    const w=best.hg>best.ag?best.h:best.hg<best.ag?best.a:null;
    bmHTML=`<div class="bm-card"><div class="bm-lbl">⚡ HIGHEST SCORING · ${best.id}</div>
      <div class="bm-row"><div class="bm-t" style="${best.hg>best.ag?'color:var(--g2)':''}">${best.h}</div>
      <div class="bm-s">${best.hg}–${best.ag}</div><div class="bm-t" style="${best.ag>best.hg?'color:var(--g2)':''}">${best.a}</div></div>
      <div class="bm-sub">${best.hg+best.ag} goals · ${w?'Winner: '+w:'Draw'}</div></div>`;
  }
  const wrCards=Object.values(GROUPS).flatMap(g=>g.p).map(n=>{
    const grp=Object.keys(GROUPS).find(k=>GROUPS[k].p.includes(n));
    const ms=M.filter(m=>m.done&&(m.h===n||m.a===n));
    const w=ms.filter(m=>(m.h===n&&m.hg>m.ag)||(m.a===n&&m.ag>m.hg)).length;
    const d=ms.filter(m=>m.hg===m.ag).length;const l=ms.length-w-d;
    const pct=ms.length?Math.round(w/ms.length*100):0;
    const r=18;const c=2*Math.PI*r;const off=c-(pct/100*c);
    return`<div class="wrc"><div class="wrn">${n}</div><div class="wrg">Grp ${grp}</div>
      <div class="wr-ring"><svg class="wr-svg" width="44" height="44" viewBox="0 0 44 44">
        <circle class="wrt2" cx="22" cy="22" r="${r}"/>
        <circle class="wrf" cx="22" cy="22" r="${r}" stroke="var(--g2)" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
      </svg><div class="wr-pct">${pct}%</div></div>
      <div class="wr-wdl"><span class="ww">${w}W</span><span class="wd">${d}D</span><span class="wl">${l}L</span></div></div>`;
  }).join('');
  document.getElementById('pg-stats').innerHTML=
    `<div class="stitle">Top Scorers</div>${scHTML}
    <div class="sgap"><div class="stitle">Best Match</div>${bmHTML}</div>
    <div class="sgap"><div class="stitle">Win Rates</div><div class="wr-grid">${wrCards}</div></div>`;
}

// ── RENDER KNOCKOUT ───────────────────────────────────────────
function renderKnockout(){
  fillKOTeams();
  const getW=id=>{const k=KO.find(x=>x.id===id);return k&&k.done?(k.hg>k.ag?k.h:k.hg<k.ag?k.a:null):null;};

  // Build bracket
  const brTeam=(id,isH)=>{
    const k=KO.find(x=>x.id===id);
    const name=isH?k.h:k.a;
    const isW=k.done&&((isH&&k.hg>k.ag)||(!isH&&k.ag>k.hg));
    return`<div class="brmt ${k.done&&!isW?'':''}${isW?'win':'tbd'}">${name||'TBD'}${k.done?`<span class="br-score">${isH?k.hg:k.ag}</span>`:''}</div>`;
  };

  // KO match card renderer
  const koCard=(id)=>{
    const k=KO.find(x=>x.id===id);
    const isFinal=id==='FIN';
    const w=k.done?(k.hg>k.ag?k.h:k.hg<k.ag?k.a:null):null;
    const score=k.done?`<div class="ko-score">${k.hg}–${k.ag}</div>`:`<div class="ko-score pending">${k.time}</div>`;
    const status=k.done?'<span class="ko-status ft">FT</span>':'<span class="ko-status up">'+k.date+'</span>';
    return`<div class="ko-card${isFinal?' final-card':''}">
      ${isFinal?'<div class="final-trophy">🏆</div><div class="final-label">GRAND FINAL</div>':''}
      <div class="ko-header">
        <span class="ko-round">${k.round}</span>
        <span class="ko-date">${k.date} · ${k.time}</span>
      </div>
      <div class="ko-match">
        <div class="ko-team ${k.h&&k.h.includes('Winner')||k.h.includes('Grp')?'tbd':''}">${k.h||'TBD'}</div>
        ${score}
        <div class="ko-team r ${k.a&&k.a.includes('Winner')||k.a.includes('Grp')||k.a.includes('Runner')?'tbd':''}">${k.a||'TBD'}</div>
      </div>
      <div class="ko-meta">${status}${w?`<span class="ko-winner">🏅 Winner: ${w}</span>`:''}</div>
    </div>`;
  };

  document.getElementById('pg-knockout').innerHTML=`
    <div class="bracket-scroll"><div class="bracket">
      <div class="br-round"><div class="brt">Quarter Finals</div>
        ${['QF1','QF2','QF3','QF4'].map(id=>`<div class="brm">${brTeam(id,true)}${brTeam(id,false)}</div>`).join('')}
      </div>
      <div class="br-round"><div class="brt">Semi Finals</div>
        ${['SF1','SF2'].map(id=>`<div class="brm">${brTeam(id,true)}${brTeam(id,false)}</div>`).join('')}
      </div>
      <div class="br-round"><div class="brt">Final</div>
        <div class="brm" style="border-color:var(--brd2)">${brTeam('FIN',true)}${brTeam('FIN',false)}</div>
        <div style="text-align:center;font-size:20px;margin-top:8px">🏆</div>
      </div>
    </div></div>
    <div class="stitle">Quarter Finals · May 28</div>
    ${['QF1','QF2','QF3','QF4'].map(id=>koCard(id)).join('')}
    <div class="stitle sgap">Semi Finals · May 30</div>
    ${['SF1','SF2'].map(id=>koCard(id)).join('')}
    <div class="stitle sgap">3rd Place & Final</div>
    ${koCard('3RD')}${koCard('FIN')}`;
}

// ── NAV ───────────────────────────────────────────────────────
function pg(id,el){
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nt').forEach(t=>t.classList.remove('on'));
  document.getElementById('pg-'+id).classList.add('on');el.classList.add('on');
  if(id==='stats')renderStats();
  if(id==='knockout')renderKnockout();
  if(id==='results')renderResults();
  if(id==='fixtures')renderFixtures();
}
function renderAll(){renderGroups();renderResults();renderKnockout();}

// ── SHARE ─────────────────────────────────────────────────────
function shareWA(){
  let t='🏆 *DAGON KHAN CUP 26*\n\n';
  Object.keys(GROUPS).forEach(k=>{const st=calc(k);t+=`*Group ${k}*\n`;st.forEach((p,i)=>t+=`${i+1}. ${p.n} — ${p.pts}pts\n`);t+='\n';});
  const kf=KO.filter(k=>k.done);if(kf.length){t+='*Knockout*\n';kf.forEach(k=>{const w=k.hg>k.ag?k.h:k.hg<k.ag?k.a:'Draw';t+=`${k.id}: ${k.h} ${k.hg}–${k.ag} ${k.a} (${w})\n`;}); t+='\n';}
  t+='🔗 https://dagon-khan-cup26.vercel.app';
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}
function copyLink(){navigator.clipboard?.writeText('https://dagon-khan-cup26.vercel.app').then(()=>showToast('🔗 Link copied!'));}

// ── TOAST ─────────────────────────────────────────────────────
let tt=null;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');if(tt)clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2500);}

// ── ADMIN ─────────────────────────────────────────────────────
const CREDS={u:'Sabit',p:'sabit232'};let loggedIn=false;let curTab='group';
function openAdmin(){document.getElementById('ao').classList.add('on');loggedIn?showPanel():showLogin();}
function closeAdmin(){document.getElementById('ao').classList.remove('on');}
function showLogin(){document.getElementById('alog').style.display='block';document.getElementById('apnl').style.display='none';document.getElementById('lerr').textContent='';document.getElementById('lu').value='';document.getElementById('lp').value='';}
function showPanel(){document.getElementById('alog').style.display='none';document.getElementById('apnl').style.display='block';renderAdminGroup();renderAdminKO();}
function doLogin(){const u=document.getElementById('lu').value.trim();const p=document.getElementById('lp').value;if(u===CREDS.u&&p===CREDS.p){loggedIn=true;showPanel();}else document.getElementById('lerr').textContent='Wrong credentials.';}
function doLogout(){loggedIn=false;showLogin();}

function switchTab(tab,el){
  curTab=tab;
  document.querySelectorAll('.adm-tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('tab-group').style.display=tab==='group'?'block':'none';
  document.getElementById('tab-knockout').style.display=tab==='knockout'?'block':'none';
}

  const k=document.getElementById('asel').value;

    <div class="mui">
      <div class="muh"><span class="muid">${m.id}: ${m.h} <span class="muvs">vs</span> ${m.a}</span><div class="rb2" onclick="resetGrp('${m.id}')">Reset</div></div>

        <div style="display:flex;align-items:center;gap:5px">
          <input class="sin" id="hg-${m.id}" type="number" min="0" max="99" value="${m.hg!==null?m.hg:''}">

          <input class="sin" id="ag-${m.id}" type="number" min="0" max="99" value="${m.ag!==null?m.ag:''}">

      </div>
      <div id="st-${m.id}" class="mst2" style="color:${m.done?'var(--gn)':'var(--ft)'}">
        ${m.done?'✓ '+m.hg+' – '+m.ag:'Pending'}</div>

function renderAdminKO(){
  const rounds=[
    {label:'Quarter Finals · May 28',ids:['QF1','QF2','QF3','QF4']},
    {label:'Semi Finals · May 30',ids:['SF1','SF2']},
    {label:'3rd Place · May 31',ids:['3RD']},
    {label:'Final · Jun 1',ids:['FIN']},
  ];
  fillKOTeams();
  document.getElementById('ko-admin-list').innerHTML=rounds.map(r=>`
    <div class="ko-section">
      <div class="ko-section-title">${r.label}</div>
      ${r.ids.map(id=>{
        const k=KO.find(x=>x.id===id);
        return`<div class="mui">
          <div class="muh">
            <span class="muid">${id}: ${k.h||'TBD'} <span class="muvs">vs</span> ${k.a||'TBD'}</span>
            <div class="rb2" onclick="resetKO('${id}')">Reset</div>
          </div>
          <div class="si-row">
            <span style="font-size:10px;color:var(--mt);min-width:44px;overflow:hidden;text-overflow:ellipsis">${(k.h||'TBD').split(' ')[0]}</span>
            <div style="display:flex;align-items:center;gap:5px">
              <input class="sin" id="khg-${id}" type="number" min="0" max="99" value="${k.hg!==null?k.hg:''}">
              <span class="sd">–</span>
              <input class="sin" id="kag-${id}" type="number" min="0" max="99" value="${k.ag!==null?k.ag:''}">
            </div>
            <span style="font-size:10px;color:var(--mt);min-width:44px;text-align:right;overflow:hidden;text-overflow:ellipsis">${(k.a||'TBD').split(' ')[0]}</span>
            <div class="sb" onclick="saveKO('${id}')">SAVE</div>
          </div>
          <div id="kst-${id}" class="mst2" style="color:${k.done?'var(--gn)':'var(--ft)'}">
            ${k.done?'✓ '+k.hg+' – '+k.ag:'Pending'}</div>
        </div>`;
      }).join('')}
    </div>`).join('');

async function saveGrp(id){
  const m=M.find(x=>x.id===id);
  const hg=parseInt(document.getElementById('hg-'+id).value);
  const ag=parseInt(document.getElementById('ag-'+id).value);
  if(isNaN(hg)||isNaN(ag)||hg<0||ag<0){showToast('⚠️ Valid score enter koro');return;}
  m.hg=hg;m.ag=ag;m.done=true;
  const s=document.getElementById('st-'+id);s.style.color='var(--mt)';s.textContent='Saving...';
  const ok=await saveToDB(id);
  if(ok){s.style.color='var(--gn)';s.textContent='✓ '+hg+' – '+ag;
    fillKOTeams();renderAdminKO();updateStats();updateTicker();renderAll();
    showToast('✅ '+id+': '+m.h+' '+hg+'–'+ag+' '+m.a);}
}
async function resetGrp(id){
  const m=M.find(x=>x.id===id);m.hg=null;m.ag=null;m.done=false;
  await saveToDB(id);renderAdminGroup();updateStats();updateTicker();renderAll();showToast('🔄 '+id+' reset');
}

async function saveKO(id){
  fillKOTeams();
  const k=KO.find(x=>x.id===id);
  const hg=parseInt(document.getElementById('khg-'+id).value);
  const ag=parseInt(document.getElementById('kag-'+id).value);
  if(isNaN(hg)||isNaN(ag)||hg<0||ag<0){showToast('⚠️ Valid score enter koro');return;}
  k.hg=hg;k.ag=ag;k.done=true;
  const s=document.getElementById('kst-'+id);s.style.color='var(--mt)';s.textContent='Saving...';
  const ok=await saveKOToDB(id);
  if(ok){s.style.color='var(--gn)';s.textContent='✓ '+hg+' – '+ag;
    fillKOTeams();renderAdminKO();updateTicker();renderAll();
    showToast('✅ '+id+': '+k.h+' '+hg+'–'+ag+' '+k.a);}
}
async function resetKO(id){
  const k=KO.find(x=>x.id===id);k.hg=null;k.ag=null;k.done=false;
  await saveKOToDB(id);fillKOTeams();renderAdminKO();updateTicker();renderAll();showToast('🔄 '+id+' reset');
}

document.getElementById('ao').addEventListener('click',function(e){if(e.target===this)closeAdmin();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('ao').classList.contains('on')&&document.getElementById('alog').style.display!=='none')doLogin();});

loadDB();
