<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dagon Khan Cup 26</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --gold:#F5C518;--gold2:#E0A800;--dark:#0a0a0f;--dark2:#12121a;
    --dark3:#1a1a26;--dark4:#22223a;--card:#181828;
    --border:rgba(245,197,24,0.18);--border2:rgba(245,197,24,0.35);
    --text:#e8e8f0;--muted:#8888aa;--green:#22c55e;--red:#ef4444;
  }
  body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}
  .header{background:linear-gradient(180deg,#0a0a0f 0%,#12121a 100%);border-bottom:2px solid var(--gold);padding:18px 20px 14px;text-align:center;position:relative}
  .header-badge{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
  .header-title{font-family:'Rajdhani',sans-serif;font-size:clamp(26px,7vw,48px);font-weight:700;color:var(--gold);line-height:1;text-shadow:0 0 40px rgba(245,197,24,0.3);letter-spacing:2px}
  .header-sub{font-size:12px;color:var(--muted);margin-top:5px;letter-spacing:1px}
  .admin-btn{position:absolute;top:16px;right:16px;background:transparent;border:1px solid var(--border2);color:var(--gold);font-family:'Inter',sans-serif;font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;transition:all .2s}
  .admin-btn:hover{background:rgba(245,197,24,0.1)}
  .nav{display:flex;overflow-x:auto;background:var(--dark2);border-bottom:1px solid var(--border);scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-tab{flex-shrink:0;padding:12px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
  .nav-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
  .nav-tab:hover:not(.active){color:var(--text)}
  .main{padding:16px;max-width:900px;margin:0 auto}
  .page{display:none}.page.active{display:block}
  .group-grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:600px){.group-grid{grid-template-columns:1fr 1fr}}
  .group-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .group-header{padding:10px 14px;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;border-bottom:1px solid var(--border)}
  .gh-a{background:rgba(59,130,246,0.15);color:#60a5fa}
  .gh-b{background:rgba(239,68,68,0.15);color:#f87171}
  .gh-c{background:rgba(34,197,94,0.15);color:#4ade80}
  .gh-d{background:rgba(168,85,247,0.15);color:#c084fc}
  .pt-table{width:100%;border-collapse:collapse;font-size:12px}
  .pt-table th{padding:6px 8px;text-align:center;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.5px;border-bottom:1px solid var(--border)}
  .pt-table th:first-child{text-align:left;padding-left:12px}
  .pt-table td{padding:8px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px}
  .pt-table td:first-child{text-align:left;padding-left:12px;font-weight:500;font-size:13px}
  .pt-table tr:last-child td{border-bottom:none}
  .pts-cell{font-weight:700;font-size:14px!important;color:var(--gold)}
  .qualify-1{background:rgba(34,197,94,0.08)}
  .qualify-2{background:rgba(59,130,246,0.06)}
  .eliminated{opacity:.5}
  .pos-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700}
  .pos-1{background:var(--gold);color:#000}
  .pos-2{background:#94a3b8;color:#000}
  .pos-3{background:#4b5563;color:var(--text)}
  .match-list{display:flex;flex-direction:column;gap:8px}
  .match-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:13px}
  .match-id{font-size:10px;color:var(--muted);min-width:24px;font-weight:600}
  .match-team{flex:1;font-weight:500}
  .match-team.right{text-align:right}
  .match-score-box{min-width:64px;text-align:center;font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700}
  .score-played{color:var(--gold)}
  .score-pending{color:var(--muted);font-size:13px;font-family:'Inter',sans-serif;font-weight:400}
  .match-status{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
  .ms-done{background:rgba(34,197,94,0.15);color:var(--green)}
  .ms-pending{background:rgba(136,136,170,0.15);color:var(--muted)}
  .winner-tag{font-size:10px;color:var(--gold)}
  .section-title{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:var(--gold);letter-spacing:1px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .section-gap{margin-top:20px}
  .knockout-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
  .ko-title{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;color:var(--gold);letter-spacing:1px;margin-bottom:10px;text-align:center}
  .admin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;overflow-y:auto}
  .admin-overlay.show{display:block}
  .admin-modal{background:var(--dark3);border:1px solid var(--border2);border-radius:16px;padding:24px;max-width:440px;margin:40px auto}
  .admin-title{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--gold);margin-bottom:16px;text-align:center}
  .form-group{margin-bottom:14px}
  .form-label{font-size:12px;color:var(--muted);margin-bottom:5px;display:block}
  .form-input,.form-select{width:100%;background:var(--dark4);border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:9px 12px;border-radius:8px;outline:none;transition:border-color .2s}
  .form-input:focus,.form-select:focus{border-color:var(--gold2)}
  .form-select option{background:var(--dark3)}
  .btn-gold{width:100%;background:var(--gold);color:#000;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;padding:11px;border:none;border-radius:8px;cursor:pointer;transition:background .2s;margin-top:4px}
  .btn-gold:hover{background:var(--gold2)}
  .btn-ghost{width:100%;background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:13px;padding:9px;border:1px solid var(--border);border-radius:8px;cursor:pointer;margin-top:8px;transition:all .2s}
  .btn-ghost:hover{color:var(--text);border-color:var(--border2)}
  .error-msg{font-size:12px;color:var(--red);margin-top:8px;text-align:center}
  .match-update-item{background:var(--dark4);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
  .mup-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;font-weight:600}
  .mup-vs{color:var(--muted);font-size:11px;font-weight:400}
  .score-inputs{display:flex;align-items:center;gap:8px}
  .score-input{width:56px;text-align:center;font-size:18px;font-family:'Rajdhani',sans-serif;font-weight:700;background:var(--dark3);border:1px solid var(--border2);color:var(--gold);border-radius:8px;padding:6px;outline:none}
  .score-dash{color:var(--muted);font-size:16px}
  .save-match-btn{font-size:11px;padding:5px 12px;background:var(--gold);color:#000;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-family:'Rajdhani',sans-serif;letter-spacing:.5px}
  .save-match-btn:hover{background:var(--gold2)}
  .reset-btn{font-size:11px;padding:5px 10px;background:transparent;color:var(--red);border:1px solid rgba(239,68,68,0.3);border-radius:6px;cursor:pointer}
  .logout-btn{width:100%;background:transparent;color:var(--red);font-family:'Inter',sans-serif;font-size:13px;padding:9px;border:1px solid rgba(239,68,68,0.3);border-radius:8px;cursor:pointer;margin-top:12px}
  .small-note{font-size:11px;color:var(--muted);text-align:center;margin-top:14px}
  .loading{text-align:center;padding:40px;color:var(--muted);font-size:14px}
  .spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .saved-ok{font-size:11px;color:var(--green);margin-top:6px}
  .conn-status{position:absolute;top:16px;left:16px;font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600}
  .conn-ok{background:rgba(34,197,94,0.15);color:var(--green)}
  .conn-err{background:rgba(239,68,68,0.15);color:var(--red)}
</style>
</head>
<body>

<div class="header">
  <div id="conn-indicator" class="conn-status" style="display:none"></div>
  <div class="header-badge">eFootball™ · Online Tournament</div>
  <div class="header-title">DAGON KHAN CUP 26</div>
  <div class="header-sub">12 Players · 4 Groups · Only 1 Champion</div>
  <button class="admin-btn" onclick="openAdmin()">⚙ Admin</button>
</div>

<div class="nav">
  <div class="nav-tab active" data-page="groups" onclick="showPage('groups',this)">Groups</div>
  <div class="nav-tab" data-page="matches" onclick="showPage('matches',this)">Matches</div>
  <div class="nav-tab" data-page="knockout" onclick="showPage('knockout',this)">Knockout</div>
</div>

<div class="main">
  <div class="page active" id="page-groups"><div class="loading"><span class="spinner"></span>Loading...</div></div>
  <div class="page" id="page-matches"><div class="loading"><span class="spinner"></span>Loading...</div></div>
  <div class="page" id="page-knockout"></div>
</div>

<!-- ADMIN OVERLAY -->
<div class="admin-overlay" id="admin-overlay">
  <div class="admin-modal">
    <div id="admin-login">
      <div class="admin-title">⚙ Admin Login</div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="login-user" type="text" placeholder="Enter username" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="login-pass" type="password" placeholder="Enter password">
      </div>
      <button class="btn-gold" onclick="doLogin()">LOGIN</button>
      <button class="btn-ghost" onclick="closeAdmin()">Cancel</button>
      <div class="error-msg" id="login-error"></div>
    </div>
    <div id="admin-panel" style="display:none">
      <div class="admin-title">⚙ Admin Panel</div>
      <div class="form-group">
        <label class="form-label">Select Group</label>
        <select class="form-select" id="admin-group-sel" onchange="renderAdminMatches()">
          <option value="A">Group A</option>
          <option value="B">Group B</option>
          <option value="C">Group C</option>
          <option value="D">Group D</option>
        </select>
      </div>
      <div id="admin-match-list"></div>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
      <button class="btn-ghost" onclick="closeAdmin()">Close</button>
    </div>
  </div>
</div>

<script>
// ── SUPABASE INIT ─────────────────────────────────────────
const SUPABASE_URL = 'https://vowhfimiedafltsepyny.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EbPTFRW7iY068IYiZiQiAg_IkcjcPZN';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── STATIC DATA ───────────────────────────────────────────
const GROUPS = {
  A:{name:'Group A',color:'gh-a',players:['OVI','SABIT','NASIM'],date:'May 24, 2026'},
  B:{name:'Group B',color:'gh-b',players:['JAWAD','MUNNA','TAHIN'],date:'May 25, 2026'},
  C:{name:'Group C',color:'gh-c',players:['IMRAN','FOKRUL','OPI'],date:'May 26, 2026'},
  D:{name:'Group D',color:'gh-d',players:['MUNTAHIR','HASMOT','NOYON'],date:'May 27, 2026'},
};
const DEFAULT_MATCHES = [
  {id:'A1',grp:'A',h:'OVI',a:'SABIT',time:'08:00 PM',hg:null,ag:null,done:false},
  {id:'A2',grp:'A',h:'SABIT',a:'NASIM',time:'08:40 PM',hg:null,ag:null,done:false},
  {id:'A3',grp:'A',h:'OVI',a:'NASIM',time:'09:20 PM',hg:null,ag:null,done:false},
  {id:'B1',grp:'B',h:'JAWAD',a:'MUNNA',time:'08:00 PM',hg:null,ag:null,done:false},
  {id:'B2',grp:'B',h:'MUNNA',a:'TAHIN',time:'08:40 PM',hg:null,ag:null,done:false},
  {id:'B3',grp:'B',h:'JAWAD',a:'TAHIN',time:'09:20 PM',hg:null,ag:null,done:false},
  {id:'C1',grp:'C',h:'IMRAN',a:'FOKRUL',time:'08:00 PM',hg:null,ag:null,done:false},
  {id:'C2',grp:'C',h:'FOKRUL',a:'OPI',time:'08:40 PM',hg:null,ag:null,done:false},
  {id:'C3',grp:'C',h:'IMRAN',a:'OPI',time:'09:20 PM',hg:null,ag:null,done:false},
  {id:'D1',grp:'D',h:'MUNTAHIR',a:'HASMOT',time:'08:00 PM',hg:null,ag:null,done:false},
  {id:'D2',grp:'D',h:'HASMOT',a:'NOYON',time:'08:40 PM',hg:null,ag:null,done:false},
  {id:'D3',grp:'D',h:'MUNTAHIR',a:'NOYON',time:'09:20 PM',hg:null,ag:null,done:false},
];

let matches = JSON.parse(JSON.stringify(DEFAULT_MATCHES));

// ── SUPABASE LOAD / SAVE ──────────────────────────────────
async function loadFromDB() {
  try {
    const {data, error} = await db.from('matches').select('*');
    if (error) throw error;
    if (data && data.length > 0) {
      data.forEach(row => {
        const m = matches.find(x => x.id === row.match_id);
        if (m) { m.hg = row.hg; m.ag = row.ag; m.done = row.done; }
      });
    }
    setConn(true);
  } catch(e) {
    setConn(false);
    console.warn('DB load failed:', e.message);
  }
  renderAll();
}

async function saveToDB(matchId) {
  const m = matches.find(x => x.id === matchId);
  try {
    const {error} = await db.from('matches').upsert(
      {match_id: m.id, grp: m.grp, h: m.h, a: m.a, hg: m.hg, ag: m.ag, done: m.done},
      {onConflict: 'match_id'}
    );
    if (error) throw error;
    setConn(true);
    return true;
  } catch(e) {
    setConn(false);
    alert('Save failed: ' + e.message);
    return false;
  }
}

function setConn(ok) {
  const el = document.getElementById('conn-indicator');
  el.style.display = 'block';
  el.className = 'conn-status ' + (ok ? 'conn-ok' : 'conn-err');
  el.textContent = ok ? '● Live' : '● Offline';
}

// ── STANDINGS ─────────────────────────────────────────────
function calcStandings(grp) {
  const players = GROUPS[grp].players;
  const s = {};
  players.forEach(p => s[p]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  matches.filter(m => m.grp===grp && m.done).forEach(m => {
    s[m.h].p++; s[m.a].p++;
    s[m.h].gf+=m.hg; s[m.h].ga+=m.ag;
    s[m.a].gf+=m.ag; s[m.a].ga+=m.hg;
    if(m.hg>m.ag){s[m.h].w++;s[m.h].pts+=3;s[m.a].l++;}
    else if(m.hg<m.ag){s[m.a].w++;s[m.a].pts+=3;s[m.h].l++;}
    else{s[m.h].d++;s[m.h].pts++;s[m.a].d++;s[m.a].pts++;}
  });
  return players.map(p=>({name:p,...s[p],gd:s[p].gf-s[p].ga}))
    .sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name));
}

// ── RENDER GROUPS ─────────────────────────────────────────
function renderGroups() {
  const grid = document.getElementById('page-groups');
  const allDone = gk => matches.filter(m=>m.grp===gk).every(m=>m.done);
  grid.innerHTML = '<div class="group-grid">' + Object.keys(GROUPS).map(gk=>{
    const g = GROUPS[gk]; const st = calcStandings(gk); const done = allDone(gk);
    const rows = st.map((p,i)=>{
      const rc = i===0?'qualify-1':i===1?'qualify-2':done?'eliminated':'';
      const bc = i===0?'pos-1':i===1?'pos-2':'pos-3';
      const gd = p.gd>0?`+${p.gd}`:p.gd;
      return `<tr class="${rc}"><td><span class="pos-badge ${bc}">${i+1}</span></td>
        <td>${p.name}</td><td>${p.p}</td><td>${p.w}</td><td>${p.d}</td><td>${p.l}</td>
        <td>${p.gf}</td><td>${p.ga}</td><td>${gd}</td><td class="pts-cell">${p.pts}</td></tr>`;
    }).join('');
    return `<div class="group-card">
      <div class="group-header ${g.color}">${g.name}<span style="float:right;font-size:11px;opacity:.7">${g.date}</span></div>
      <table class="pt-table">
        <thead><tr><th>#</th><th style="text-align:left;padding-left:12px">Player</th>
        <th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }).join('') + '</div><div class="small-note">🟢 Top 2 qualify · 🔴 3rd eliminated</div>';
}

// ── RENDER MATCHES ────────────────────────────────────────
function renderMatches() {
  const cont = document.getElementById('page-matches');
  cont.innerHTML = Object.keys(GROUPS).map((gk,i)=>{
    const g = GROUPS[gk];
    const items = matches.filter(m=>m.grp===gk).map(m=>{
      const scoreHTML = m.done
        ? `<span class="match-score-box score-played">${m.hg} – ${m.ag}</span>`
        : `<span class="match-score-box score-pending">${m.time}</span>`;
      const statusHTML = m.done
        ? `<span class="match-status ms-done">FT</span>`
        : `<span class="match-status ms-pending">Upcoming</span>`;
      let wNote = '';
      if(m.done){const w=m.hg>m.ag?m.h:m.hg<m.ag?m.a:null;wNote=w?`<span class="winner-tag">↑${w}</span>`:`<span style="color:#f97316;font-size:10px">DRAW</span>`;}
      return `<div class="match-item">
        <div class="match-id">${m.id}</div>
        <div class="match-team">${m.h}</div>${scoreHTML}
        <div class="match-team right">${m.a}</div>
        <div style="min-width:50px;text-align:right">${statusHTML}<br>${wNote}</div></div>`;
    }).join('');
    return `<div class="section-title ${i>0?'section-gap':''}">${g.name} <span style="font-size:12px;color:var(--muted);font-family:Inter">${g.date}</span></div>
      <div class="match-list">${items}</div>`;
  }).join('');
}

// ── RENDER KNOCKOUT ───────────────────────────────────────
function renderKnockout() {
  const q={};
  Object.keys(GROUPS).forEach(gk=>{const s=calcStandings(gk);q[gk]={first:s[0].name,second:s[1].name};});
  const fmt=(g,pos)=>{
    const val=pos===1?q[g].first:q[g].second;
    const done=matches.filter(m=>m.grp===g).every(m=>m.done);
    return done?`<strong>${val}</strong>`:`<span style="color:var(--muted)">${g} ${pos===1?'1st':'2nd'}</span>`;
  };
  const qfMatches=[
    {id:'QF1',h:fmt('A',1),a:fmt('D',2),t:'08:00 PM'},
    {id:'QF2',h:fmt('B',1),a:fmt('C',2),t:'08:45 PM'},
    {id:'QF3',h:fmt('C',1),a:fmt('B',2),t:'09:30 PM'},
    {id:'QF4',h:fmt('D',1),a:fmt('A',2),t:'10:15 PM'},
  ];
  const mkItem=(id,h,a,t,muted=false)=>`<div class="match-item">
    <div class="match-id">${id}</div>
    <div class="match-team" ${muted?'style="color:var(--muted)"':''}>${h}</div>
    <div class="match-score-box score-pending">${t}</div>
    <div class="match-team right" ${muted?'style="color:var(--muted)"':''}>${a}</div>
    <div style="min-width:50px;text-align:right"><span class="match-status ms-pending">Upcoming</span></div></div>`;
  document.getElementById('page-knockout').innerHTML=`
    <div class="knockout-card">
      <div class="ko-title">⚡ QUARTER FINALS — May 28, 2026</div>
      <div class="match-list">${qfMatches.map(m=>mkItem(m.id,m.h,m.a,m.t)).join('')}</div>
    </div>
    <div class="knockout-card">
      <div class="ko-title">🔥 SEMI FINALS — May 30, 2026</div>
      <div class="match-list">
        ${mkItem('SF1','QF1 Winner','QF2 Winner','08:30 PM',true)}
        ${mkItem('SF2','QF3 Winner','QF4 Winner','09:30 PM',true)}
      </div>
    </div>
    <div class="knockout-card">
      <div class="ko-title">🥉 3RD PLACE — May 31, 2026</div>
      <div class="match-list">${mkItem('3RD','SF1 Runner Up','SF2 Runner Up','08:30 PM',true)}</div>
    </div>
    <div class="knockout-card" style="border-color:rgba(245,197,24,0.4);background:rgba(245,197,24,0.05)">
      <div class="ko-title" style="font-size:18px">🏆 FINAL — June 1, 2026</div>
      <div class="match-list">${mkItem('FINAL','SF1 Winner','SF2 Winner','09:00 PM',true)}</div>
    </div>`;
}

function renderAll(){renderGroups();renderMatches();renderKnockout();}

// ── NAV ───────────────────────────────────────────────────
function showPage(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  el.classList.add('active');
}

// ── ADMIN ─────────────────────────────────────────────────
const CREDS={user:'Sabit',pass:'sabit232'};
let adminLoggedIn=false;

function openAdmin(){
  document.getElementById('admin-overlay').classList.add('show');
  adminLoggedIn?showAdminPanel():showLoginScreen();
}
function closeAdmin(){document.getElementById('admin-overlay').classList.remove('show');}
function showLoginScreen(){
  document.getElementById('admin-login').style.display='block';
  document.getElementById('admin-panel').style.display='none';
  document.getElementById('login-error').textContent='';
  document.getElementById('login-user').value='';
  document.getElementById('login-pass').value='';
}
function showAdminPanel(){
  document.getElementById('admin-login').style.display='none';
  document.getElementById('admin-panel').style.display='block';
  renderAdminMatches();
}
function doLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pass').value;
  if(u===CREDS.user&&p===CREDS.pass){adminLoggedIn=true;showAdminPanel();}
  else document.getElementById('login-error').textContent='Wrong username or password.';
}
function doLogout(){adminLoggedIn=false;showLoginScreen();}

function renderAdminMatches(){
  const gk=document.getElementById('admin-group-sel').value;
  const list=document.getElementById('admin-match-list');
  list.innerHTML=matches.filter(m=>m.grp===gk).map(m=>`
    <div class="match-update-item">
      <div class="mup-header">
        <span>${m.id}: ${m.h} <span class="mup-vs">vs</span> ${m.a}</span>
        <button class="reset-btn" onclick="resetMatch('${m.id}')">Reset</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--muted);min-width:50px">${m.h}</span>
        <div class="score-inputs">
          <input class="score-input" id="hg-${m.id}" type="number" min="0" max="99" value="${m.hg!==null?m.hg:''}" placeholder="0">
          <span class="score-dash">–</span>
          <input class="score-input" id="ag-${m.id}" type="number" min="0" max="99" value="${m.ag!==null?m.ag:''}" placeholder="0">
        </div>
        <span style="font-size:12px;color:var(--muted);min-width:50px;text-align:right">${m.a}</span>
        <button class="save-match-btn" onclick="saveMatch('${m.id}')">SAVE</button>
      </div>
      <div id="status-${m.id}" style="margin-top:6px;font-size:11px;color:${m.done?'var(--green)':'var(--muted)'}">
        ${m.done?`✓ Saved: ${m.hg} – ${m.ag}`:'Not played yet'}
      </div>
    </div>`).join('');
}

async function saveMatch(id){
  const m=matches.find(x=>x.id===id);
  const hg=parseInt(document.getElementById('hg-'+id).value);
  const ag=parseInt(document.getElementById('ag-'+id).value);
  if(isNaN(hg)||isNaN(ag)||hg<0||ag<0){alert('Valid score dao (0 ba beshi)');return;}
  m.hg=hg;m.ag=ag;m.done=true;
  const statusEl=document.getElementById('status-'+id);
  statusEl.style.color='var(--muted)';
  statusEl.textContent='Saving...';
  const ok=await saveToDB(id);
  if(ok){
    statusEl.style.color='var(--green)';
    statusEl.textContent=`✓ Saved: ${hg} – ${ag}`;
    renderAll();
  }
}

async function resetMatch(id){
  const m=matches.find(x=>x.id===id);
  m.hg=null;m.ag=null;m.done=false;
  await saveToDB(id);
  renderAdminMatches();
  renderAll();
}

document.getElementById('admin-overlay').addEventListener('click',function(e){if(e.target===this)closeAdmin();});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('admin-overlay').classList.contains('show')){
    if(document.getElementById('admin-login').style.display!=='none')doLogin();
  }
});

// ── INIT ──────────────────────────────────────────────────
loadFromDB();
</script>
</body>
</html>
