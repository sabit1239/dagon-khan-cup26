<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dagon Khan Cup 26</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#F5C518;--gold2:#d4a800;--gold3:#ffd84d;--goldglow:rgba(245,197,24,0.25);
  --dark:#050508;--dark2:#0b0b12;--dark3:#10101a;--dark4:#171726;--card:#0e0e1c;
  --border:rgba(245,197,24,0.12);--border2:rgba(245,197,24,0.28);--border3:rgba(245,197,24,0.5);
  --text:#e2e2f0;--muted:#6060a0;--faint:#2a2a45;
  --green:#16c064;--green2:rgba(22,192,100,0.13);
  --red:#e03030;--red2:rgba(224,48,48,0.13);
  --blue2:rgba(37,99,235,0.1);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ═══════════════ HEADER ═══════════════ */
.header{position:relative;padding:0;background:var(--dark2);border-bottom:1px solid var(--border2);overflow:hidden}
.header-bg{position:absolute;inset:0;background:radial-gradient(ellipse 100% 200% at 50% 0%,rgba(245,197,24,0.06) 0%,transparent 60%);pointer-events:none}
.header-lines{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 80px,rgba(245,197,24,0.02) 80px,rgba(245,197,24,0.02) 81px);pointer-events:none}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.hd-controls{display:flex;gap:8px;align-items:center}
.live-pill{display:flex;align-items:center;gap:5px;background:rgba(22,192,100,0.1);border:1px solid rgba(22,192,100,0.25);border-radius:20px;padding:4px 10px;font-size:10px;font-weight:600;color:var(--green)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(22,192,100,0.5)}50%{opacity:.8;box-shadow:0 0 0 4px rgba(22,192,100,0)}}
.admin-btn{background:transparent;border:1px solid var(--border2);color:var(--gold);font-size:11px;font-weight:500;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .2s}
.admin-btn:hover{background:var(--goldglow)}
.header-main{padding:14px 16px 16px;text-align:center;position:relative}
.logo-wrap{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
/* SVG LOGO */
.dkg-logo{width:52px;height:52px;flex-shrink:0}
.header-title{font-family:'Rajdhani',sans-serif;font-size:clamp(20px,5.5vw,40px);font-weight:700;color:var(--gold);letter-spacing:1.5px;line-height:1;text-shadow:0 0 30px rgba(245,197,24,0.4)}
.header-sub{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:1.5px}
.hd-badges{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.hd-badge{font-size:10px;color:var(--muted);background:var(--faint);border-radius:4px;padding:2px 8px}
.hd-badge.gold{color:var(--gold);background:rgba(245,197,24,0.08);border:1px solid var(--border)}

/* ═══════════════ TICKER ═══════════════ */
.ticker{background:var(--dark3);border-bottom:1px solid var(--border);padding:7px 0;overflow:hidden;position:relative}
.ticker::before,.ticker::after{content:'';position:absolute;top:0;bottom:0;width:40px;z-index:1}
.ticker::before{left:0;background:linear-gradient(90deg,var(--dark3),transparent)}
.ticker::after{right:0;background:linear-gradient(-90deg,var(--dark3),transparent)}
.ticker-track{display:flex;gap:0;animation:tickerScroll 30s linear infinite;width:max-content}
.ticker-item{font-size:11px;color:var(--text);padding:0 24px;white-space:nowrap;border-right:1px solid var(--border)}
.ticker-item span{color:var(--gold);font-weight:600}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ═══════════════ STATS BAR ═══════════════ */
.stats-bar{display:flex;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.stats-bar::-webkit-scrollbar{display:none}
.stat-cell{flex:1;min-width:72px;padding:10px 6px;text-align:center;border-right:1px solid var(--border);position:relative}
.stat-cell:last-child{border-right:none}
.stat-val{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--gold);line-height:1}
.stat-lbl{font-size:8px;color:var(--muted);margin-top:2px;letter-spacing:.5px;text-transform:uppercase}

/* ═══════════════ NAV ═══════════════ */
.nav{display:flex;background:var(--dark2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:50}
.nav::-webkit-scrollbar{display:none}
.nav-tab{flex-shrink:0;padding:11px 16px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.nav-tab:hover:not(.active){color:var(--text)}

/* ═══════════════ MAIN ═══════════════ */
.main{padding:14px;max-width:960px;margin:0 auto}
.page{display:none}.page.active{display:block}

/* ═══════════════ SECTION TITLE ═══════════════ */
.sec-title{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
.sec-gap{margin-top:20px}

/* ═══════════════ GROUP CARD ═══════════════ */
.group-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.group-grid{grid-template-columns:1fr 1fr}}
.group-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.group-header{padding:9px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.gh-name{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px}
.gh-date{font-size:9px;color:var(--muted)}
.gh-a{background:rgba(59,130,246,0.07)}.gh-a .gh-name{color:#60a5fa}
.gh-b{background:rgba(239,68,68,0.07)}.gh-b .gh-name{color:#f87171}
.gh-c{background:rgba(34,197,94,0.07)}.gh-c .gh-name{color:#4ade80}
.gh-d{background:rgba(168,85,247,0.07)}.gh-d .gh-name{color:#c084fc}

/* ═══════════════ PT TABLE ═══════════════ */
.pt-table{width:100%;border-collapse:collapse}
.pt-table th{padding:4px 5px;text-align:center;color:var(--muted);font-size:8px;font-weight:600;letter-spacing:.5px;border-bottom:1px solid var(--border);text-transform:uppercase}
.pt-table th.tl{text-align:left;padding-left:12px}
.pt-table td{padding:7px 5px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.03);font-size:11px}
.pt-table td.tl{text-align:left;padding-left:10px}
.pt-table tr:last-child td{border-bottom:none}
.pts-cell{font-weight:700;font-size:13px;color:var(--gold)}
.row-q1{background:rgba(22,192,100,0.06)}.row-q2{background:rgba(59,130,246,0.04)}.row-elim{opacity:.4}
.pos-badge{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;font-size:8px;font-weight:700}
.p1{background:var(--gold);color:#000}.p2{background:#94a3b8;color:#000}.p3{background:#2d3748;color:var(--muted)}
.player-name{display:flex;align-items:center;gap:6px}
.avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;border:1px solid rgba(255,255,255,0.06)}
.av-OVI{background:rgba(59,130,246,0.2);color:#60a5fa}
.av-SABIT{background:rgba(245,197,24,0.2);color:var(--gold)}
.av-NASIM{background:rgba(239,68,68,0.2);color:#f87171}
.av-JAWAD{background:rgba(34,197,94,0.2);color:#4ade80}
.av-MUNNA{background:rgba(168,85,247,0.2);color:#c084fc}
.av-TAHIN{background:rgba(234,88,12,0.2);color:#fb923c}
.av-IMRAN{background:rgba(6,182,212,0.2);color:#22d3ee}
.av-FOKRUL{background:rgba(236,72,153,0.2);color:#f472b6}
.av-OPI{background:rgba(132,204,22,0.2);color:#a3e635}
.av-MUNTAHIR{background:rgba(245,158,11,0.2);color:#fbbf24}
.av-HASMOT{background:rgba(99,102,241,0.2);color:#818cf8}
.av-NOYON{background:rgba(20,184,166,0.2);color:#2dd4bf}
.qual-chip{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:3px}
.qc-q{background:var(--green2);color:var(--green)}.qc-e{background:var(--red2);color:var(--red)}

/* ═══════════════ MATCH ITEMS ═══════════════ */
.match-list{display:flex;flex-direction:column;gap:7px}
.match-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;transition:border-color .2s}
.match-item:hover{border-color:var(--border2)}
.match-id-badge{font-size:9px;color:var(--muted);min-width:20px;font-weight:600}
.match-team{flex:1;font-weight:500;font-size:12px}
.match-team.r{text-align:right}
.match-score-box{min-width:56px;text-align:center;font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;color:var(--gold)}
.score-pending{color:var(--muted);font-size:10px;font-family:'Inter',sans-serif;font-weight:400}
.match-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:44px}
.ms{font-size:8px;padding:2px 6px;border-radius:6px;font-weight:600;text-align:center}
.ms-ft{background:var(--green2);color:var(--green)}.ms-up{background:rgba(96,96,160,0.1);color:var(--muted)}
.win-tag{font-size:8px;color:var(--gold)}.draw-tag{font-size:8px;color:#f97316}

/* ═══════════════ HEADLINE FEED ═══════════════ */
.headline-feed{display:flex;flex-direction:column;gap:7px}
.headline-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:12px;transition:border-color .2s}
.headline-item:hover{border-color:var(--border2)}
.hl-icon{font-size:18px;flex-shrink:0}
.hl-text{flex:1;font-size:12px;line-height:1.5;color:var(--text)}
.hl-text strong{color:var(--gold);font-weight:600}
.hl-text .loser{color:var(--red)}
.hl-text .winner{color:var(--green)}
.hl-time{font-size:9px;color:var(--muted);flex-shrink:0}
.hl-score{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:var(--gold);flex-shrink:0}

/* ═══════════════ TOP SCORERS ═══════════════ */
.scorers-list{display:flex;flex-direction:column;gap:7px}
.scorer-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.scorer-rank{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:var(--faint);min-width:20px;text-align:center}
.sr-gold{color:var(--gold)}.sr-silver{color:#94a3b8}.sr-bronze{color:#b45309}
.scorer-info{flex:1}
.scorer-name{font-weight:600;font-size:13px}
.scorer-grp{font-size:10px;color:var(--muted);margin-bottom:4px}
.goal-bar-wrap{height:3px;background:var(--faint);border-radius:2px;overflow:hidden}
.goal-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold2),var(--gold3));transition:width .8s ease}
.scorer-goals{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:var(--gold);text-align:center}
.scorer-goals-lbl{font-size:8px;color:var(--muted);text-align:center}

/* ═══════════════ BEST MATCH ═══════════════ */
.best-card{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.best-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(245,197,24,0.05),transparent 70%);pointer-events:none}
.best-label{font-size:9px;color:var(--gold);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.bm-row{display:flex;align-items:center;justify-content:center;gap:10px}
.bm-team{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;flex:1;text-align:center}
.bm-score{font-family:'Rajdhani',sans-serif;font-size:30px;font-weight:700;color:var(--gold);min-width:64px;text-align:center}
.bm-sub{font-size:10px;color:var(--muted);text-align:center;margin-top:4px}

/* ═══════════════ WIN RATE ═══════════════ */
.wr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:500px){.wr-grid{grid-template-columns:repeat(4,1fr)}}
.wr-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center}
.wr-name{font-weight:600;font-size:11px;margin-bottom:1px}
.wr-grp{font-size:9px;color:var(--muted);margin-bottom:7px}
.wr-ring{position:relative;width:48px;height:48px;margin:0 auto 5px}
.wr-svg{transform:rotate(-90deg)}
.wr-track{fill:none;stroke:var(--faint);stroke-width:4}
.wr-fill{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.wr-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;color:var(--gold)}
.wr-wdl{display:flex;justify-content:center;gap:5px;font-size:9px}
.ww{color:var(--green)}.wd{color:#fbbf24}.wl{color:var(--red)}

/* ═══════════════ COUNTDOWN ═══════════════ */
.countdown-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;position:relative;overflow:hidden}
.countdown-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% 0%,rgba(245,197,24,0.04),transparent);pointer-events:none}
.cd-label{font-size:9px;color:var(--muted);text-align:center;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.cd-match-name{font-size:13px;font-weight:600;text-align:center;margin-bottom:10px}
.cd-timer{display:flex;justify-content:center;align-items:center;gap:6px}
.cd-unit{text-align:center;background:var(--dark4);border-radius:8px;padding:6px 10px;min-width:44px}
.cd-num{font-family:'Rajdhani',sans-serif;font-size:24px;font-weight:700;color:var(--gold);line-height:1}
.cd-lbl{font-size:8px;color:var(--muted)}
.cd-sep{font-family:'Rajdhani',sans-serif;font-size:20px;color:var(--faint);margin-bottom:10px}

/* ═══════════════ BRACKET ═══════════════ */
.bracket-scroll{overflow-x:auto;padding-bottom:8px}
.bracket{display:flex;gap:2px;min-width:580px}
.br-round{flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:0 6px}
.br-title{font-size:9px;color:var(--muted);font-weight:600;letter-spacing:1px;text-align:center;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border);text-transform:uppercase}
.br-match{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:4px 0}
.br-team{padding:6px 10px;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.br-team:last-child{border-bottom:none}
.br-team.tbd{color:var(--faint)}
.br-team.win{color:var(--gold);font-weight:600}

/* ═══════════════ SHARE ═══════════════ */
.share-row{display:flex;gap:8px;margin-top:10px}
.share-wa{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#25d366;color:#fff;border:none;border-radius:8px;padding:9px;font-size:12px;font-weight:600;cursor:pointer}
.share-wa:hover{background:#1fb855}
.share-copy{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--dark4);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px;font-size:12px;font-weight:500;cursor:pointer}
.share-copy:hover{border-color:var(--border2)}

/* ═══════════════ TOAST ═══════════════ */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--dark3);border:1px solid var(--border2);border-radius:10px;padding:9px 18px;font-size:12px;font-weight:500;z-index:300;transition:transform .3s;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ═══════════════ ADMIN ═══════════════ */
.admin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;overflow-y:auto}
.admin-overlay.show{display:block}
.admin-modal{background:var(--dark3);border:1px solid var(--border2);border-radius:16px;padding:20px;max-width:400px;margin:28px auto}
.admin-title{font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;color:var(--gold);margin-bottom:12px;text-align:center}
.form-group{margin-bottom:11px}
.form-label{font-size:10px;color:var(--muted);margin-bottom:4px;display:block;letter-spacing:.5px;text-transform:uppercase}
.form-input,.form-select{width:100%;background:var(--dark4);border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:8px 11px;border-radius:8px;outline:none;transition:border-color .2s}
.form-input:focus,.form-select:focus{border-color:var(--gold2)}
.form-select option{background:var(--dark3)}
.btn-gold{width:100%;background:var(--gold);color:#000;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;padding:10px;border:none;border-radius:8px;cursor:pointer;transition:background .2s;margin-top:3px}
.btn-gold:hover{background:var(--gold2)}
.btn-ghost{width:100%;background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:12px;padding:8px;border:1px solid var(--border);border-radius:8px;cursor:pointer;margin-top:7px;transition:all .2s}
.btn-ghost:hover{color:var(--text)}
.err-msg{font-size:11px;color:var(--red);margin-top:7px;text-align:center}
.mup-item{background:var(--dark4);border:1px solid var(--border);border-radius:9px;padding:11px;margin-bottom:9px}
.mup-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.mup-id{font-size:12px;font-weight:600}
.mup-vs{color:var(--muted);font-size:10px;font-weight:400}
.score-inputs{display:flex;align-items:center;gap:7px}
.score-input{width:48px;text-align:center;font-size:17px;font-family:'Rajdhani',sans-serif;font-weight:700;background:var(--dark3);border:1px solid var(--border2);color:var(--gold);border-radius:7px;padding:5px;outline:none}
.score-dash{color:var(--muted);font-size:14px}
.save-btn{font-size:10px;padding:5px 11px;background:var(--gold);color:#000;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-family:'Rajdhani',sans-serif}
.reset-btn{font-size:10px;padding:4px 8px;background:transparent;color:var(--red);border:1px solid rgba(224,48,48,0.25);border-radius:5px;cursor:pointer}
.mup-st{margin-top:5px;font-size:10px}
.logout-btn{width:100%;background:transparent;color:var(--red);font-family:'Inter',sans-serif;font-size:12px;padding:8px;border:1px solid rgba(224,48,48,0.2);border-radius:8px;cursor:pointer;margin-top:10px}
.loading{text-align:center;padding:32px;color:var(--muted);font-size:12px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.small-note{font-size:9px;color:var(--faint);text-align:center;margin-top:10px;letter-spacing:.5px}
@keyframes qpop{0%{transform:scale(0.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.qpop{animation:qpop .35s ease forwards}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-bg"></div><div class="header-lines"></div>
  <div class="header-top">
    <div style="font-size:9px;color:var(--muted);letter-spacing:1px">EFOOTBALL™</div>
    <div class="hd-controls">
      <div class="live-pill" id="live-pill" style="display:none"><div class="live-dot"></div>LIVE</div>

async function loadDB(){
  try{
    const{data,error}=await db.from('matches').select('*');
    if(error)throw error;
    if(data&&data.length)data.forEach(r=>{const m=matches.find(x=>x.id===r.match_id);if(m){m.hg=r.hg;m.ag=r.ag;m.done=r.done;}});
    setLive(true);
  }catch(e){setLive(false);console.warn(e.message);}
  updateStats();updateTicker();renderAll();
}
async function saveToDB(mid){
  const m=matches.find(x=>x.id===mid);
  try{
    const{error}=await db.from('matches').upsert({match_id:m.id,grp:m.grp,h:m.h,a:m.a,hg:m.hg,ag:m.ag,done:m.done},{onConflict:'match_id'});
    if(error)throw error;
    setLive(true);return true;
  }catch(e){setLive(false);showToast('❌ Save failed');return false;}
}
function setLive(ok){

  document.getElementById('sb-qual').textContent=qual;
}

// ── TICKER ──────────────────────────────────────────────────
function updateTicker(){
  const pl=matches.filter(m=>m.done);
  let items=pl.map(m=>{
    const w=m.hg>m.ag?m.h:m.hg<m.ag?m.a:null;
    const txt=w?`<span>${m.h}</span> ${m.hg}–${m.ag} <span>${m.a}</span> · Winner: <span>${w}</span>`:`<span>${m.h}</span> ${m.hg}–${m.ag} <span>${m.a}</span> · DRAW`;
    return `<div class="ticker-item">${m.id}: ${txt}</div>`;
  });
  if(!items.length)items=['<div class="ticker-item">🏆 <span>DAGON KHAN CUP 26</span> · Group Stage Begins May 24, 2026</div>','<div class="ticker-item">📋 <span>12 Players</span> · 4 Groups · Only 1 Champion</div>','<div class="ticker-item">⚡ <span>Play Fair. Play Hard. Become the Champion.</span></div>'];
  const doubled=items.concat(items);
  document.getElementById('ticker-track').innerHTML=doubled.join('');
}

// ── STANDINGS ───────────────────────────────────────────────
function calcStandings(grp){
  const players=GROUPS[grp].players;
  const s={};
  players.forEach(p=>s[p]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  matches.filter(m=>m.grp===grp&&m.done).forEach(m=>{
    s[m.h].p++;s[m.a].p++;
    s[m.h].gf+=m.hg;s[m.h].ga+=m.ag;
    s[m.a].gf+=m.ag;s[m.a].ga+=m.hg;
    if(m.hg>m.ag){s[m.h].w++;s[m.h].pts+=3;s[m.a].l++;}
    else if(m.hg<m.ag){s[m.a].w++;s[m.a].pts+=3;s[m.h].l++;}
    else{s[m.h].d++;s[m.h].pts++;s[m.a].d++;s[m.a].pts++;}
  });
  return players.map(p=>({name:p,...s[p],gd:s[p].gf-s[p].ga}))
    .sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name));
}
function av(n){return `<div class="avatar av-${n}">${n.slice(0,2)}</div>`;}

// ── RENDER GROUPS ────────────────────────────────────────────
function renderGroups(){
  const el=document.getElementById('page-groups');
  el.innerHTML='<div class="group-grid">'+Object.keys(GROUPS).map(gk=>{
    const g=GROUPS[gk];const st=calcStandings(gk);
    const done=matches.filter(m=>m.grp===gk).every(m=>m.done);
    const rows=st.map((p,i)=>{
      const rc=i===0?'row-q1':i===1?'row-q2':done?'row-elim':'';
      const bc=i===0?'p1':i===1?'p2':'p3';
      const gd=p.gd>0?'+'+p.gd:p.gd;
      const chip=done?(i<2?'<span class="qual-chip qc-q qpop">Q</span>':'<span class="qual-chip qc-e">✕</span>'):'';
      return `<tr class="${rc}"><td><span class="pos-badge ${bc}">${i+1}</span></td>
        <td class="tl"><div class="player-name">${av(p.name)}<span>${p.name}</span>${chip}</div></td>
        <td>${p.p}</td><td>${p.w}</td><td>${p.d}</td><td>${p.l}</td>
        <td>${p.gf}</td><td>${p.ga}</td><td>${gd}</td><td class="pts-cell">${p.pts}</td></tr>`;
    }).join('');
    return `<div class="group-card"><div class="group-header ${g.color}">
      <span class="gh-name">${g.name}</span><span class="gh-date">${g.date}</span></div>
      <table class="pt-table">
        <thead><tr><th>#</th><th class="tl">Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  }).join('')+'</div><div class="small-note">🟢 Top 2 qualify for Quarter Finals · 🔴 3rd place eliminated</div>';
}

// ── RENDER HEADLINES ─────────────────────────────────────────
function renderHeadlines(){
  const el=document.getElementById('page-headlines');
  const played=matches.filter(m=>m.done).slice().reverse();
  if(!played.length){el.innerHTML='<div class="loading" style="padding:40px">No results yet — check back after matches!</div>';return;}

  const headlines=played.map(m=>{
    const total=m.hg+m.ag;
    const isDraw=m.hg===m.ag;
    const winner=m.hg>m.ag?m.h:m.a;
    const loser=m.hg>m.ag?m.a:m.h;
    const wScore=m.hg>m.ag?m.hg:m.ag;
    const lScore=m.hg>m.ag?m.ag:m.hg;
    let icon='⚽';let txt='';
    if(isDraw){
      icon='🤝';
      txt=`<strong>${m.h}</strong> and <strong>${m.a}</strong> played out a <strong>${m.hg}–${m.ag} draw</strong> in Group ${m.grp}.`;
    }else if(wScore-lScore>=3){
      icon='💥';
      txt=`<span class="winner">${winner}</span> demolished <span class="loser">${loser}</span> with a commanding <strong>${wScore}–${lScore}</strong> victory in Group ${m.grp}.`;
    }else if(wScore-lScore===2){
      icon='🔥';
      txt=`<span class="winner">${winner}</span> defeated <span class="loser">${loser}</span> <strong>${wScore}–${lScore}</strong> in a solid Group ${m.grp} win.`;
    }else{
      icon='⚡';
      txt=`A thrilling Group ${m.grp} clash — <span class="winner">${winner}</span> edged out <span class="loser">${loser}</span> <strong>${wScore}–${lScore}</strong>.`;
    }
    return `<div class="headline-item">
      <div class="hl-icon">${icon}</div>
      <div class="hl-text">${txt}</div>
      <div style="text-align:right">
        <div class="hl-score">${m.hg}–${m.ag}</div>
        <div class="hl-time">${m.id}</div>
      </div>
    </div>`;
  }).join('');

  // Group qualification headlines
  let qualHL='';
  Object.keys(GROUPS).forEach(gk=>{
    const done=matches.filter(m=>m.grp===gk).every(m=>m.done);
    if(done){
      const st=calcStandings(gk);
      qualHL+=`<div class="headline-item" style="border-color:rgba(22,192,100,0.25);background:rgba(22,192,100,0.04)">
        <div class="hl-icon">🏅</div>
        <div class="hl-text">Group ${gk} complete! <span class="winner">${st[0].name}</span> (1st) and <span class="winner">${st[1].name}</span> (2nd) advance to the Quarter Finals. <span class="loser">${st[2].name}</span> is eliminated.</div>
      </div>`;
    }
  });

  el.innerHTML=(qualHL?`<div class="sec-title">Qualification</div><div class="headline-feed">${qualHL}</div><div class="sec-gap">`:'')+
    `<div class="sec-title">Match Results</div><div class="headline-feed">${headlines}</div>`+
    (qualHL?'</div>':'')+'<div class="share-row"><button class="share-wa" onclick="shareWA()">📲 Share on WhatsApp</button><button class="share-copy" onclick="copyLink()">🔗 Copy Link</button></div>';
}

function renderMatches(){
  const el=document.getElementById('page-matches');

    const dt=new Date(SCHED[next.id]);

      </div></div>`;

  el.innerHTML=cdHTML+Object.keys(GROUPS).map((gk,i)=>{

      <div class="match-list">${matches.filter(m=>m.grp===gk).map(m=>{
        const sc=m.done?`<div class="match-score-box">${m.hg}–${m.ag}</div>`:`<div class="match-score-box score-pending">${TIMES[m.id]}</div>`;
        const st=m.done?'<span class="ms ms-ft">FT</span>':'<span class="ms ms-up">Upcoming</span>';
        let wt='';
        if(m.done){const w=m.hg>m.ag?m.h:m.hg<m.ag?m.a:null;wt=w?`<div class="win-tag">↑${w}</div>`:`<div class="draw-tag">DRAW</div>`;}
        return `<div class="match-item"><div class="match-id-badge">${m.id}</div>
          <div class="match-team">${m.h}</div>${sc}<div class="match-team r">${m.a}</div>
          <div class="match-meta">${st}${wt}</div></div>`;
      }).join('')}</div></div>`;
  }).join('');
}

// ── COUNTDOWN ───────────────────────────────────────────────
let cdInt=null;
function startCountdown(target){
  if(cdInt)clearInterval(cdInt);
  function tick(){
    const diff=target-new Date();
    if(diff<=0){clearInterval(cdInt);return;}
    const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
    const fh=document.getElementById('cd-h'),fm=document.getElementById('cd-m'),fs=document.getElementById('cd-s');
    if(fh)fh.textContent=String(h).padStart(2,'0');
    if(fm)fm.textContent=String(m).padStart(2,'0');
    if(fs)fs.textContent=String(s).padStart(2,'0');
  }
  tick();cdInt=setInterval(tick,1000);
}

  const sm={};
  Object.values(GROUPS).forEach(g=>g.players.forEach(p=>sm[p]={name:p,goals:0,grp:Object.keys(GROUPS).find(k=>GROUPS[k].players.includes(p))}));
  matches.filter(m=>m.done).forEach(m=>{sm[m.h].goals+=m.hg;sm[m.a].goals+=m.ag;});
  const scorers=Object.values(sm).sort((a,b)=>b.goals-a.goals);
  const maxG=scorers[0]?.goals||1;
  const rk=(i)=>i===0?'sr-gold':i===1?'sr-silver':i===2?'sr-bronze':'';
  const scHTML=scorers.filter(s=>s.goals>0).slice(0,8).map((s,i)=>`

      <div class="scorer-rank ${rk(i)}">${i+1}</div>
      ${av(s.name)}
      <div class="scorer-info">
        <div class="scorer-name">${s.name}</div>
        <div class="scorer-grp">Group ${s.grp}</div>
        <div class="goal-bar-wrap"><div class="goal-bar" style="width:${(s.goals/maxG*100).toFixed(0)}%"></div></div>
      </div>
      <div><div class="scorer-goals">${s.goals}</div><div class="scorer-goals-lbl">Goals</div></div>
    </div>`).join('')||'<div class="loading" style="padding:16px;font-size:12px">No goals recorded yet</div>';

  const pl=matches.filter(m=>m.done);
  let bmHTML='<div class="loading" style="padding:16px;font-size:12px">No matches played yet</div>';
  if(pl.length){
    const best=pl.reduce((b,m)=>(m.hg+m.ag>b.hg+b.ag)?m:b,pl[0]);
    const w=best.hg>best.ag?best.h:best.hg<best.ag?best.a:null;
    bmHTML=`<div class="best-card">
      <div class="best-label">⚡ Most Goals · ${best.id}</div>
      <div class="bm-row">
        <div class="bm-team" style="${best.hg>best.ag?'color:var(--gold)':''}">${best.h}</div>
        <div class="bm-score">${best.hg}–${best.ag}</div>
        <div class="bm-team" style="${best.ag>best.hg?'color:var(--gold)':''}">${best.a}</div>
      </div>
      <div class="bm-sub">${best.hg+best.ag} goals total${w?' · Winner: '+w:' · Draw'}</div>
    </div>`;
  }

  const wrCards=Object.values(GROUPS).flatMap(g=>g.players).map(name=>{
    const grp=Object.keys(GROUPS).find(k=>GROUPS[k].players.includes(name));
    const ms=matches.filter(m=>m.done&&(m.h===name||m.a===name));
    const w=ms.filter(m=>(m.h===name&&m.hg>m.ag)||(m.a===name&&m.ag>m.hg)).length;
    const d=ms.filter(m=>m.hg===m.ag).length;
    const l=ms.length-w-d;
    const pct=ms.length?Math.round(w/ms.length*100):0;
    const r=20;const circ=2*Math.PI*r;const off=circ-(pct/100*circ);
    return `<div class="wr-card">
      <div class="wr-name">${name}</div><div class="wr-grp">Grp ${grp}</div>
      <div class="wr-ring">
        <svg class="wr-svg" width="48" height="48" viewBox="0 0 48 48">
          <circle class="wr-track" cx="24" cy="24" r="${r}"/>
          <circle class="wr-fill" cx="24" cy="24" r="${r}" stroke="var(--gold)"
            stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
        </svg>
        <div class="wr-pct">${pct}%</div>
      </div>
      <div class="wr-wdl"><span class="ww">${w}W</span><span class="wd">${d}D</span><span class="wl">${l}L</span></div>
    </div>`;
  }).join('');

  document.getElementById('page-stats').innerHTML=`
    <div class="sec-title">Top Scorers</div><div class="scorers-list">${scHTML}</div>
    <div class="sec-gap"><div class="sec-title">Best Match</div>${bmHTML}</div>
    <div class="sec-gap"><div class="sec-title">Win Rates</div><div class="wr-grid">${wrCards}</div></div>`;
}

// ── KNOCKOUT ─────────────────────────────────────────────────
function renderKnockout(){
  const q={};
  Object.keys(GROUPS).forEach(gk=>{const s=calcStandings(gk);q[gk]={f:s[0].name,s:s[1].name};});
  const isDone=gk=>matches.filter(m=>m.grp===gk).every(m=>m.done);
  const ft=(g,p)=>{const d=isDone(g);const n=p===1?q[g].f:q[g].s;return d?`<div class="br-team win">${n}</div>`:`<div class="br-team tbd">Grp ${g} ${p===1?'1st':'2nd'}</div>`;};
  const fmt=(g,p)=>{const d=isDone(g);const n=p===1?q[g].f:q[g].s;return d?`<strong style="color:var(--gold)">${n}</strong>`:`<span style="color:var(--faint)">Grp ${g} ${p===1?'1st':'2nd'}</span>`;};

  document.getElementById('page-knockout').innerHTML=`
    <div class="bracket-scroll"><div class="bracket">
      <div class="br-round">
        <div class="br-title">Quarter Finals · May 28</div>
        <div class="br-match">${ft('A',1)}${ft('D',2)}</div>
        <div class="br-match">${ft('B',1)}${ft('C',2)}</div>
        <div class="br-match">${ft('C',1)}${ft('B',2)}</div>
        <div class="br-match">${ft('D',1)}${ft('A',2)}</div>
      </div>
      <div class="br-round">
        <div class="br-title">Semi Finals · May 30</div>
        <div class="br-match"><div class="br-team tbd">QF1 Winner</div><div class="br-team tbd">QF2 Winner</div></div>
        <div class="br-match"><div class="br-team tbd">QF3 Winner</div><div class="br-team tbd">QF4 Winner</div></div>
      </div>
      <div class="br-round">
        <div class="br-title">Final · Jun 1</div>
        <div class="br-match" style="border-color:var(--border2)">
          <div class="br-team tbd">SF1 Winner</div><div class="br-team tbd">SF2 Winner</div>
        </div>
        <div style="text-align:center;margin-top:10px;font-size:24px">🏆</div>
      </div>
    </div></div>
    <div class="sec-gap"><div class="sec-title">QF Matchups · May 28, 2026</div>
    <div class="match-list">
      ${[['QF1',fmt('A',1),fmt('D',2),'08:00 PM'],['QF2',fmt('B',1),fmt('C',2),'08:45 PM'],
         ['QF3',fmt('C',1),fmt('B',2),'09:30 PM'],['QF4',fmt('D',1),fmt('A',2),'10:15 PM']]
        .map(([id,h,a,t])=>`<div class="match-item">
          <div class="match-id-badge">${id}</div>
          <div class="match-team">${h}</div>
          <div class="match-score-box score-pending">${t}</div>
          <div class="match-team r">${a}</div>
          <div class="match-meta"><span class="ms ms-up">May 28</span></div>
        </div>`).join('')}
    </div></div>
    <div class="sec-gap"><div class="match-list">
      ${[['SF1','QF1 Winner','QF2 Winner','08:30 PM','May 30'],['SF2','QF3 Winner','QF4 Winner','09:30 PM','May 30'],
         ['3RD','SF1 Runner','SF2 Runner','08:30 PM','May 31'],['🏆','SF1 Winner','SF2 Winner','09:00 PM','Jun 1']]
        .map(([id,h,a,t,dt])=>`<div class="match-item" style="${id==='🏆'?'border-color:var(--border2);background:rgba(245,197,24,0.03)':''}">
          <div class="match-id-badge" style="${id==='🏆'?'color:var(--gold)':''}">${id}</div>
          <div class="match-team" style="color:var(--faint)">${h}</div>
          <div class="match-score-box score-pending">${t}</div>
          <div class="match-team r" style="color:var(--faint)">${a}</div>
          <div class="match-meta"><span class="ms ms-up">${dt}</span></div>
        </div>`).join('')}
    </div></div>`;
}

// ── SHARE ────────────────────────────────────────────────────
function shareWA(){
  let txt='🏆 *DAGON KHAN CUP 26*\n📊 Current Standings\n\n';
  Object.keys(GROUPS).forEach(gk=>{
    const st=calcStandings(gk);
    txt+=`*Group ${gk}*\n`;
    st.forEach((p,i)=>txt+=`${i+1}. ${p.name} — ${p.pts}pts (${p.w}W ${p.d}D ${p.l}L)\n`);
    txt+='\n';
  });
  const pl=matches.filter(m=>m.done);
  if(pl.length){txt+='*Recent Results*\n';pl.slice(-4).forEach(m=>{const w=m.hg>m.ag?m.h:m.hg<m.ag?m.a:'Draw';txt+=`${m.h} ${m.hg}–${m.ag} ${m.a}${w!=='Draw'?' ('+w+')':''}\n`;});}
  txt+='\n🔗 https://dagon-khan-cup26.vercel.app';
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}
function copyLink(){
  navigator.clipboard.writeText('https://dagon-khan-cup26.vercel.app').then(()=>showToast('🔗 Link copied!'));
}

// ── TOAST ────────────────────────────────────────────────────
let tTimer=null;
function showToast(msg,dur=2500){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  if(tTimer)clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('show'),dur);
}

// ── NAV ──────────────────────────────────────────────────────
function showPage(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  el.classList.add('active');
  if(id==='stats')renderStats();
  if(id==='knockout')renderKnockout();
  if(id==='headlines')renderHeadlines();
}

// ── ADMIN ────────────────────────────────────────────────────
const CREDS={u:'Sabit',p:'sabit232'};let loggedIn=false;
function openAdmin(){document.getElementById('admin-overlay').classList.add('show');loggedIn?showPanel():showLogin();}
function closeAdmin(){document.getElementById('admin-overlay').classList.remove('show');}
function showLogin(){document.getElementById('admin-login').style.display='block';document.getElementById('admin-panel').style.display='none';document.getElementById('lerr').textContent='';document.getElementById('lu').value='';document.getElementById('lp').value='';}
function showPanel(){document.getElementById('admin-login').style.display='none';document.getElementById('admin-panel').style.display='block';renderAdminMatches();}
function doLogin(){const u=document.getElementById('lu').value.trim();const p=document.getElementById('lp').value;if(u===CREDS.u&&p===CREDS.p){loggedIn=true;showPanel();}else document.getElementById('lerr').textContent='Wrong credentials.';}
function doLogout(){loggedIn=false;showLogin();}
function renderAdminMatches(){
  const gk=document.getElementById('ag-sel').value;
  document.getElementById('admin-match-list').innerHTML=matches.filter(m=>m.grp===gk).map(m=>`
    <div class="mup-item">
      <div class="mup-hdr">
        <span class="mup-id">${m.id}: ${m.h} <span class="mup-vs">vs</span> ${m.a}</span>
        <button class="reset-btn" onclick="resetMatch('${m.id}')">Reset</button>
      </div>
      <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
        <span style="font-size:11px;color:var(--muted);min-width:46px">${m.h}</span>
        <div class="score-inputs">
          <input class="score-input" id="hg-${m.id}" type="number" min="0" max="99" value="${m.hg!==null?m.hg:''}">
          <span class="score-dash">–</span>
          <input class="score-input" id="ag-${m.id}" type="number" min="0" max="99" value="${m.ag!==null?m.ag:''}">
        </div>
        <span style="font-size:11px;color:var(--muted);min-width:46px;text-align:right">${m.a}</span>
        <button class="save-btn" onclick="saveMatch('${m.id}')">SAVE</button>
      </div>
      <div id="st-${m.id}" class="mup-st" style="color:${m.done?'var(--green)':'var(--faint)'}">
        ${m.done?'✓ '+m.hg+' – '+m.ag:'Pending'}</div>
    </div>`).join('');
}
async function saveMatch(id){
  const m=matches.find(x=>x.id===id);
  const hg=parseInt(document.getElementById('hg-'+id).value);
  const ag=parseInt(document.getElementById('ag-'+id).value);
  if(isNaN(hg)||isNaN(ag)||hg<0||ag<0){showToast('⚠️ Valid score enter koro');return;}
  m.hg=hg;m.ag=ag;m.done=true;
  const st=document.getElementById('st-'+id);st.style.color='var(--muted)';st.textContent='Saving...';
  const ok=await saveToDB(id);
  if(ok){st.style.color='var(--green)';st.textContent='✓ '+hg+' – '+ag;
    updateStats();updateTicker();renderGroups();renderMatches();renderKnockout();renderHeadlines();
    showToast('✅ '+id+': '+m.h+' '+hg+'–'+ag+' '+m.a);}
}
async function resetMatch(id){
  const m=matches.find(x=>x.id===id);m.hg=null;m.ag=null;m.done=false;
  await saveToDB(id);renderAdminMatches();updateStats();updateTicker();renderGroups();renderMatches();renderKnockout();renderHeadlines();showToast('🔄 '+id+' reset');
}
function renderAll(){renderGroups();renderMatches();renderKnockout();renderHeadlines();}
document.getElementById('admin-overlay').addEventListener('click',function(e){if(e.target===this)closeAdmin();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('admin-overlay').classList.contains('show')&&document.getElementById('admin-login').style.display!=='none')doLogin();});

// ── INIT ─────────────────────────────────────────────────────
loadDB();
</script>
</body>
</html>
